<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>텔레그램 접수 확인 – 딜 관리 시스템</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="sidebar"></div>

<div id="main">
  <div class="page-header">
    <div>
      <h1 class="page-title"><i class="fas fa-robot me-2" style="color:#1a237e"></i>텔레그램 접수 확인</h1>
      <p class="page-sub">텔레그램으로 들어온 딜 제보를 AI가 정리했습니다. 내용을 확인·수정하고 등록하세요.</p>
    </div>
    <button class="btn btn-outline-secondary" onclick="loadDrafts()">
      <i class="fas fa-rotate me-1"></i>새로고침
    </button>
  </div>

  <div class="content-area">
    <div id="draftList">
      <div class="text-center py-5 text-muted">
        <i class="fas fa-spinner fa-spin fa-2x"></i>
        <p class="mt-3">불러오는 중...</p>
      </div>
    </div>

    <div class="mt-5">
      <h6 class="text-muted mb-3"><i class="fas fa-clock-rotate-left me-1"></i>최근 처리 내역</h6>
      <div id="processedList" class="text-muted small">불러오는 중...</div>
    </div>
  </div>
</div>

<!-- 반려 사유 모달 -->
<div class="modal fade" id="rejectModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title"><i class="fas fa-ban text-danger me-2"></i>초안 반려</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted small">반려하면 딜로 등록되지 않습니다. 사유를 남겨두면 나중에 참고할 수 있습니다.</p>
        <textarea id="rejectReasonInput" class="form-control" rows="3" placeholder="예) 중복 접수, 투자 대상 아님..."></textarea>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
        <button type="button" class="btn btn-danger" onclick="confirmReject()">
          <i class="fas fa-ban me-1"></i> 반려
        </button>
      </div>
    </div>
  </div>
</div>

<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="vendor/supabase/supabase.js"></script>
<script src="js/config.js"></script>
<script>
  if (DEMO_MODE) document.write('<script src="js/seed-data.js"><\/script>');
</script>
<script src="js/common.js"></script>
<script>
let rejectModal = null;
let rejectingDraftId = null;

// selected 값은 비교(===)에만 쓰이고 화면에 직접 찍히지 않으므로,
// check_xss.py 가 잡아내는 4건(asset_class 등)은 실제 취약점이 아닙니다.
function optionsHtml(list, selected) {
  return list.map(v => `<option value="${escapeHtml(v)}" ${v === selected ? 'selected' : ''}>${escapeHtml(v)}</option>`).join('');
}

// currencyUnit() 의 결과(label)는 항상 common.js의 CURRENCY_UNIT 표에 있는
// 고정 문자열(억원/백만달러/...) 중 하나이고, p.currency 값 자체가 그대로
// 찍히지 않으므로 check_xss.py 가 잡아내는 144행도 실제 취약점이 아닙니다.
function draftCardHtml(d) {
  const p = d.parsed || {};
  const intakeDate = (d.created_at || '').slice(0, 10);
  return `
  <div class="detail-section mb-4">
    <div class="detail-section-header d-flex justify-content-between align-items-center">
      <span><i class="fas fa-paper-plane me-1" style="color:#1a237e"></i>${escapeHtml(d.telegram_username || '알 수 없음')}
        <span class="text-muted small ms-2">${formatDateTime(d.created_at)}</span></span>
      <span class="badge bg-warning text-dark">확인 대기</span>
    </div>
    <div class="detail-section-body">
      <div class="mb-3 p-2 bg-light border rounded">
        <div class="text-muted small mb-1">원문</div>
        <div style="white-space:pre-wrap">${escapeHtml(d.raw_message)}</div>
      </div>

      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">딜명 <span class="required-star">*</span></label>
          <input type="text" class="form-control" id="f_name_${d.id}" value="${escapeHtml(p.deal_name || '')}">
        </div>
        <div class="col-md-3">
          <label class="form-label">자산군 <span class="required-star">*</span></label>
          <select class="form-select" id="f_asset_${d.id}">
            <option value="">선택하세요</option>
            ${optionsHtml(ASSET_CLASSES, p.asset_class)}
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">담당자 <span class="required-star">*</span></label>
          <select class="form-select" id="f_assignee_${d.id}">
            ${optionsHtml([UNASSIGNED, ...TEAM_MEMBERS], p.assigned_to || UNASSIGNED)}
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label">딜 규모(억원)</label>
          <input type="number" class="form-control" step="0.1" id="f_size_${d.id}" value="${escapeHtml(p.deal_size ? p.deal_size/1e8 : '')}">
        </div>
        <div class="col-md-4">
          <label class="form-label">소개자 / GP</label>
          <input type="text" class="form-control" id="f_intro_${d.id}" value="${escapeHtml(p.introducer_gp || '')}">
        </div>
        <div class="col-md-4">
          <label class="form-label">접수일</label>
          <input type="date" class="form-control" id="f_date_${d.id}" value="${intakeDate}">
        </div>

        <div class="col-md-3">
          <label class="form-label">투자수단</label>
          <select class="form-select" id="f_vehicle_${d.id}">
            <option value="">선택 안 함</option>
            ${optionsHtml(INVESTMENT_VEHICLES, p.investment_vehicle)}
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">통화</label>
          <select class="form-select" id="f_currency_${d.id}" onchange="onDraftCurrencyChange('${d.id}')">
            <option value="">선택 안 함</option>
            ${optionsHtml(CURRENCIES, p.currency)}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">당사 검토금액(<span id="f_reviewamt_unit_${d.id}">${(currencyUnit(p.currency || 'KRW').label) || '그대로'}</span>)</label>
          <input type="number" class="form-control" step="0.01" id="f_reviewamt_${d.id}" value="${escapeHtml(p.review_amount ? p.review_amount/currencyUnit(p.currency || 'KRW').factor : '')}">
        </div>
        <div class="col-md-3">
          <label class="form-label">만기 / 기대수익률</label>
          <div class="d-flex gap-1">
            <input type="text" class="form-control" id="f_maturity_${d.id}" placeholder="만기" value="${escapeHtml(p.maturity_term || '')}">
            <input type="text" class="form-control" id="f_return_${d.id}" placeholder="기대수익률" value="${escapeHtml(p.expected_return || '')}">
          </div>
        </div>

        <div class="col-md-6">
          <label class="form-label">핵심 투자논거</label>
          <textarea class="form-control" rows="2" id="f_thesis_${d.id}">${escapeHtml(p.investment_thesis || '')}</textarea>
        </div>
        <div class="col-md-6">
          <label class="form-label">주요 위험</label>
          <textarea class="form-control" rows="2" id="f_risks_${d.id}">${escapeHtml(p.key_risks || '')}</textarea>
        </div>
      </div>

      <div class="mt-3 d-flex gap-2">
        <button class="btn btn-primary" onclick="confirmAsDeal('${d.id}')">
          <i class="fas fa-check me-1"></i>딜로 등록
        </button>
        <button class="btn btn-outline-danger" onclick="openReject('${d.id}')">
          <i class="fas fa-ban me-1"></i>반려
        </button>
      </div>
    </div>
  </div>`;
}

async function loadDrafts() {
  const listEl = document.getElementById('draftList');
  listEl.innerHTML = '<div class="text-center py-5 text-muted"><i class="fas fa-spinner fa-spin fa-2x"></i><p class="mt-3">불러오는 중...</p></div>';
  try {
    const drafts = await getDealDrafts('대기');
    if (drafts.length === 0) {
      listEl.innerHTML = '<div class="text-center py-5 text-muted"><i class="fas fa-inbox fa-2x mb-3"></i><p>확인 대기 중인 초안이 없습니다.</p></div>';
    } else {
      listEl.innerHTML = drafts.map(draftCardHtml).join('');
    }
  } catch (err) {
    listEl.innerHTML = `<div class="alert alert-danger">불러오기 실패: ${escapeHtml(err.message)}</div>`;
  }
  loadProcessed();
}

async function loadProcessed() {
  const el = document.getElementById('processedList');
  try {
    const [done, rejected] = await Promise.all([getDealDrafts('등록완료'), getDealDrafts('반려')]);
    const items = [...done, ...rejected]
      .sort((a, b) => new Date(b.reviewed_at || b.created_at) - new Date(a.reviewed_at || a.created_at))
      .slice(0, 10);
    if (items.length === 0) { el.textContent = '처리 내역이 없습니다.'; return; }
    el.innerHTML = items.map(d => `
      <div class="py-1 border-bottom">
        ${d.status === '등록완료'
          ? '<span class="badge bg-success me-2">등록완료</span>'
          : '<span class="badge bg-secondary me-2">반려</span>'}
        ${escapeHtml((d.parsed && d.parsed.deal_name) || d.raw_message.slice(0, 30))}
        <span class="text-muted">· ${escapeHtml(d.reviewed_by || '')} · ${formatDateTime(d.reviewed_at)}</span>
        ${d.created_deal_id ? `<a href="deal-detail.html?id=${d.created_deal_id}" class="ms-2">상세보기</a>` : ''}
      </div>`).join('');
  } catch (err) {
    el.textContent = '불러오기 실패: ' + err.message;
  }
}

// 통화를 바꾸면 입력 단위(억/백만/천만)도 바뀌므로, 숫자를 엉뚱한 단위로
// 그대로 두지 않도록 라벨을 새 단위로 바꾸고 입력칸은 비웁니다.
function onDraftCurrencyChange(id) {
  const currency = document.getElementById(`f_currency_${id}`).value || 'KRW';
  const unit = currencyUnit(currency);
  document.getElementById(`f_reviewamt_unit_${id}`).textContent = unit.label || '그대로';
  document.getElementById(`f_reviewamt_${id}`).value = '';
}

function readDraftForm(id) {
  const val = (suffix) => document.getElementById(`f_${suffix}_${id}`).value;
  const reviewUnit = currencyUnit(val('currency') || 'KRW');
  return {
    deal_name:          val('name').trim(),
    intake_channel:     '텔레그램',
    intake_date:        val('date'),
    asset_class:        val('asset'),
    assigned_to:        val('assignee'),
    current_stage:      '접수',
    deal_size:          Math.round(Number(val('size')) * 1e8) || null,
    introducer_gp:      val('intro').trim() || null,
    investment_vehicle: val('vehicle') || null,
    currency:           val('currency') || null,
    review_amount:      Math.round(Number(val('reviewamt')) * reviewUnit.factor) || null,
    maturity_term:      val('maturity').trim() || null,
    expected_return:    val('return').trim() || null,
    investment_thesis:  val('thesis').trim() || null,
    key_risks:          val('risks').trim() || null,
  };
}

async function confirmAsDeal(id) {
  const data = readDraftForm(id);
  if (!data.deal_name || !data.asset_class || !data.assigned_to || !data.intake_date) {
    showToast('딜명·자산군·담당자·접수일은 필수입니다.', 'warning');
    return;
  }
  try {
    const created = await confirmDraft(id, data);
    showToast('딜로 등록되었습니다.', 'success');
    setTimeout(() => { window.location.href = `deal-detail.html?id=${created.id}`; }, 700);
  } catch (err) {
    showToast('등록 실패: ' + err.message, 'danger');
  }
}

function openReject(id) {
  rejectingDraftId = id;
  document.getElementById('rejectReasonInput').value = '';
  if (!rejectModal) rejectModal = new bootstrap.Modal(document.getElementById('rejectModal'));
  rejectModal.show();
}

async function confirmReject() {
  const reason = document.getElementById('rejectReasonInput').value.trim();
  try {
    await rejectDraft(rejectingDraftId, reason || null);
    rejectModal.hide();
    showToast('반려했습니다.', 'success');
    loadDrafts();
  } catch (err) {
    showToast('반려 실패: ' + err.message, 'danger');
  }
}

renderNav('drafts');
loadDrafts();
</script>
</body>
</html>
