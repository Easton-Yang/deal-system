<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>딜 목록 – 딜 관리 시스템</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="sidebar"></div>

<div id="main">
  <div class="page-header">
    <div>
      <h1 class="page-title"><i class="fas fa-list me-2" style="color:#1a237e"></i>딜 목록</h1>
      <p class="page-sub" id="dealCount">불러오는 중...</p>
    </div>
    <div class="d-flex gap-2 align-items-center">
      <!-- 뷰 전환 -->
      <div class="btn-group" role="group">
        <button id="btnList"   class="btn btn-sm btn-primary"          onclick="setView('list')">
          <i class="fas fa-list me-1"></i>목록
        </button>
        <button id="btnKanban" class="btn btn-sm btn-outline-primary"  onclick="setView('kanban')">
          <i class="fas fa-columns me-1"></i>칸반
        </button>
      </div>
      <a href="deal-new.html" class="btn btn-primary btn-sm">
        <i class="fas fa-plus me-1"></i>새 딜
      </a>
    </div>
  </div>

  <div class="content-area">

    <!-- 필터 바 -->
    <div class="filter-bar">
      <div style="flex:1;min-width:180px">
        <input type="text" id="filterSearch" class="form-control"
          placeholder="🔍  딜명 또는 GP명 검색..." style="width:100%">
      </div>
      <select id="filterAsset" class="form-select" style="width:130px">
        <option value="">자산군 전체</option>
      </select>
      <select id="filterStage" class="form-select" style="width:120px">
        <option value="">단계 전체</option>
      </select>
      <select id="filterAssignee" class="form-select" style="width:110px">
        <option value="">담당자 전체</option>
      </select>
      <select id="filterStatus" class="form-select" style="width:130px">
        <option value="">상태 전체</option>
      </select>
      <button class="btn btn-outline-secondary btn-sm" onclick="resetFilters()">
        <i class="fas fa-undo me-1"></i>초기화
      </button>
    </div>

    <!-- ── 담당자 일괄 변경 바 (선택한 건이 있을 때만 보임) ── -->
    <div id="bulkBar" class="card mb-3 d-none" style="border-left:4px solid #1a237e">
      <div class="card-body py-2 d-flex align-items-center flex-wrap gap-2">
        <span class="fw-bold" style="color:#1a237e">
          <i class="fas fa-check-square me-1"></i><span id="bulkCount">0</span>건 선택
        </span>
        <span id="bulkHidden" class="text-danger d-none" style="font-size:12px"></span>
        <span class="text-muted" style="font-size:13px">담당자를</span>
        <select id="bulkAssignee" class="form-select form-select-sm" style="width:140px"></select>
        <span class="text-muted" style="font-size:13px">(으)로</span>
        <button type="button" class="btn btn-sm btn-primary" id="bulkApplyBtn">
          <i class="fas fa-user-check me-1"></i>변경
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="bulkClearBtn">
          선택 해제
        </button>
        <span id="bulkStatus" class="ms-2" style="font-size:13px"></span>
      </div>
    </div>

    <!-- ── 목록 뷰 ── -->
    <div id="listView">
      <div class="card">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table mb-0">
              <thead>
                <tr>
                  <th style="width:36px" class="text-center">
                    <input type="checkbox" class="form-check-input" id="checkAll"
                           title="보이는 딜 전체 선택">
                  </th>
                  <th style="width:28%">딜명</th>
                  <th>자산군</th>
                  <th>인입경로</th>
                  <th>인입일</th>
                  <th>담당자</th>
                  <th>딜 규모</th>
                  <th>현재 단계</th>
                  <th>상태</th>
                  <th>다음 액션</th>
                  <th>최종결과</th>
                  <th style="width:60px"></th>
                </tr>
              </thead>
              <tbody id="dealsBody"></tbody>
            </table>
          </div>
          <div id="emptyState" class="empty-state d-none">
            <i class="fas fa-search d-block"></i>
            <p>검색 결과가 없습니다</p>
          </div>
        </div>
      </div>
    </div>

    <!-- ── 칸반 뷰 ── -->
    <div id="kanbanView" class="d-none">
      <div class="kanban-hint text-muted mb-2" style="font-size:12px">
        <i class="fas fa-info-circle me-1"></i>카드를 다른 컬럼으로 드래그하면 단계가 변경됩니다.
      </div>
      <div class="kanban-board" id="kanbanBoard"></div>
      <div id="kanbanEmpty" class="empty-state d-none">
        <i class="fas fa-search d-block"></i>
        <p>해당하는 딜이 없습니다</p>
      </div>
    </div>

  </div>
</div>

<!-- 삭제 확인 모달 -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title"><i class="fas fa-exclamation-triangle text-danger me-2"></i>딜 삭제</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p><strong id="deleteDealName"></strong> 딜을 삭제하시겠습니까?</p>
        <p class="text-danger mb-0"><small>삭제된 데이터는 복구할 수 없습니다.</small></p>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">삭제</button>
      </div>
    </div>
  </div>
</div>

<!-- 패스 사유 모달 -->
<div class="modal fade" id="passReasonModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title"><i class="fas fa-ban text-danger me-2"></i>패스 사유</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">사유 분류</label>
          <select id="pr_reason" class="form-select">
            <option value="">선택 안 함</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">상세 메모</label>
          <textarea id="pr_note" class="form-control" rows="3" placeholder="패스 사유를 구체적으로 적어주세요..."></textarea>
        </div>
        <div>
          <label class="form-label">재검토 조건 (선택)</label>
          <textarea id="pr_condition" class="form-control" rows="2" placeholder="예: 가격을 10% 낮추면 재검토"></textarea>
        </div>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
        <button type="button" class="btn btn-danger" onclick="confirmPassReason()">
          <i class="fas fa-ban me-1"></i> 패스로 처리
        </button>
      </div>
    </div>
  </div>
</div>

<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="vendor/supabase/supabase.js"></script>
<script src="js/config.js"></script>
<script>
  // 라이브 모드에서는 실제 딜 데이터가 담긴 seed-data.js를 아예 내려받지
  // 않습니다. 로그인 전 화면에서도 받아가던 파일이라, 대외비 데이터 노출을
  // 막기 위해 데모 모드일 때만 불러옵니다.
  if (DEMO_MODE) document.write('<script src="js/seed-data.js"><\/script>');
</script>
<script src="js/common.js"></script>
<script>
let allDeals = [];
let currentView = 'list';

// 담당자 일괄 변경을 위해 '선택된 딜'을 기억합니다.
// 필터를 바꾸면 표가 다시 그려지는데, 그때도 선택이 풀리지 않게 하려고
// 화면이 아니라 여기에 보관합니다.
const selectedIds = new Set();
let deleteTargetId = null;
let dragSrcId = null;
const deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));

// ── 뷰 전환 ────────────────────────────────────────────────────

function setView(view) {
  currentView = view;
  document.getElementById('listView').classList.toggle('d-none', view !== 'list');
  document.getElementById('kanbanView').classList.toggle('d-none', view !== 'kanban');
  // 칸반에는 체크박스가 없으므로 일괄 변경 바도 감춥니다.
  syncBulkBar();
  document.getElementById('btnList').className   = view === 'list'   ? 'btn btn-sm btn-primary'         : 'btn btn-sm btn-outline-primary';
  document.getElementById('btnKanban').className = view === 'kanban' ? 'btn btn-sm btn-primary'         : 'btn btn-sm btn-outline-primary';
  applyFilters();
}

// ── 필터 ───────────────────────────────────────────────────────

function buildFilters() {
  const assetSel = document.getElementById('filterAsset');
  ASSET_CLASSES.forEach(a => {
    const o = document.createElement('option'); o.value = o.textContent = a; assetSel.appendChild(o);
  });
  const stageSel = document.getElementById('filterStage');
  STAGES.forEach(s => {
    const o = document.createElement('option'); o.value = o.textContent = s; stageSel.appendChild(o);
  });
  const assignSel = document.getElementById('filterAssignee');
  [...TEAM_MEMBERS, UNASSIGNED].forEach(m => {
    const o = document.createElement('option'); o.value = o.textContent = m; assignSel.appendChild(o);
  });
  const statusSel = document.getElementById('filterStatus');
  REVIEW_STATUSES.forEach(s => {
    const o = document.createElement('option'); o.value = o.textContent = s; statusSel.appendChild(o);
  });
}

function resetFilters() {
  ['filterSearch','filterAsset','filterStage','filterAssignee','filterStatus'].forEach(id => {
    const el = document.getElementById(id);
    el.tagName === 'INPUT' ? (el.value = '') : (el.value = '');
  });
  applyFilters();
}

function filterDeals() {
  const q     = document.getElementById('filterSearch').value.trim().toLowerCase();
  const asset = document.getElementById('filterAsset').value;
  const stage = document.getElementById('filterStage').value;
  const who   = document.getElementById('filterAssignee').value;
  const status = document.getElementById('filterStatus').value;
  return allDeals.filter(d =>
    (!q      || d.deal_name.toLowerCase().includes(q) || (d.introducer_gp||'').toLowerCase().includes(q)) &&
    (!asset  || d.asset_class === asset) &&
    (!stage  || d.current_stage === stage) &&
    (!who    || d.assigned_to === who) &&
    (!status || dealStatus(d) === status)
  );
}

function applyFilters() {
  const filtered = filterDeals();
  document.getElementById('dealCount').textContent = `총 ${filtered.length}건`;
  if (currentView === 'list') renderTable(filtered);
  else                        renderKanban(filtered);
}

// ── 목록 뷰 ────────────────────────────────────────────────────

function renderTable(deals) {
  const tbody = document.getElementById('dealsBody');
  const empty = document.getElementById('emptyState');
  if (deals.length === 0) {
    tbody.innerHTML = '';
    empty.classList.remove('d-none');
    document.getElementById('checkAll').checked = false;
    syncBulkBar();
    return;
  }
  empty.classList.add('d-none');
  tbody.innerHTML = deals.map(d => `
    <tr onclick="location.href='deal-detail.html?id=${d.id}'" style="cursor:pointer">
      <td class="text-center js-check-cell" onclick="event.stopPropagation()">
        <input type="checkbox" class="form-check-input js-row-check"
               data-id="${escapeHtml(d.id)}" ${selectedIds.has(d.id) ? 'checked' : ''}>
      </td>
      <td>
        <div style="font-weight:600">${escapeHtml(d.deal_name)}</div>
        ${d.introducer_gp ? `<div style="font-size:11px;color:#6c757d">${escapeHtml(d.introducer_gp)}</div>` : ''}
      </td>
      <td>${assetBadge(d.asset_class)}</td>
      <td><span class="text-muted">${escapeHtml(d.intake_channel)}</span></td>
      <td style="white-space:nowrap">${escapeHtml(d.intake_date || '-')}</td>
      <td>${escapeHtml(d.assigned_to)}</td>
      <td style="white-space:nowrap">${formatCurrency(d.deal_size)}</td>
      <td>${stageBadge(d.current_stage)}</td>
      <td>${statusBadge(dealStatus(d))}</td>
      <td>${nextActionSummaryHTML(d)}</td>
      <td>${resultBadge(d.final_result)}</td>
      <td>
        <button type="button" class="btn btn-sm btn-outline-danger js-delete-deal"
          data-id="${escapeHtml(d.id)}" data-name="${escapeHtml(d.deal_name)}">
          <i class="fas fa-trash"></i>
        </button>
      </td>
    </tr>`).join('');

  // 보이는 딜이 모두 선택됐는지에 따라 머리글 체크박스를 맞춥니다.
  const allChecked = deals.length > 0 && deals.every(d => selectedIds.has(d.id));
  document.getElementById('checkAll').checked = allChecked;
  syncBulkBar();
}

// ── 담당자 일괄 변경 ────────────────────────────────────────────

// 일괄 변경 바를 현재 선택 상태에 맞춰 보이거나 숨깁니다.
function syncBulkBar() {
  const bar = document.getElementById('bulkBar');
  if (!bar) return;
  const show = currentView === 'list' && selectedIds.size > 0;
  bar.classList.toggle('d-none', !show);
  document.getElementById('bulkCount').textContent = selectedIds.size;
  if (!show) { document.getElementById('bulkStatus').textContent = ''; }

  // 필터를 바꿔도 선택은 유지됩니다. 자산군별로 걸러 가며 골라 담을 수 있어
  // 편하지만, '지금 화면에 안 보이는 건'까지 함께 바뀌므로 그 숫자를 알려줍니다.
  const hiddenEl = document.getElementById('bulkHidden');
  if (!hiddenEl) return;
  if (!show) { hiddenEl.classList.add('d-none'); return; }
  const visibleIds = new Set(filterDeals().map(d => d.id));
  let hidden = 0;
  selectedIds.forEach(id => { if (!visibleIds.has(id)) hidden++; });
  if (hidden > 0) {
    hiddenEl.textContent = `(현재 화면에 보이지 않는 ${hidden}건 포함)`;
    hiddenEl.classList.remove('d-none');
  } else {
    hiddenEl.classList.add('d-none');
  }
}

// 담당자 드롭다운 채우기 (미배정 포함 — 배정을 취소할 수도 있어야 합니다)
function buildBulkAssigneeOptions() {
  const sel = document.getElementById('bulkAssignee');
  sel.innerHTML = [...TEAM_MEMBERS, UNASSIGNED]
    .map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');
}

// 행 체크박스: click 은 위의 td 에서 멈추지만 change 는 따로 올라옵니다.
document.getElementById('dealsBody').addEventListener('change', function (e) {
  const box = e.target.closest('.js-row-check');
  if (!box) return;
  const id = box.dataset.id;
  if (box.checked) selectedIds.add(id); else selectedIds.delete(id);

  const visible = filterDeals();
  document.getElementById('checkAll').checked =
    visible.length > 0 && visible.every(d => selectedIds.has(d.id));
  syncBulkBar();
});

// 머리글 체크박스: '지금 화면에 보이는(필터된) 딜'만 대상으로 합니다.
document.getElementById('checkAll').addEventListener('change', function () {
  const visible = filterDeals();
  visible.forEach(d => this.checked ? selectedIds.add(d.id) : selectedIds.delete(d.id));
  document.querySelectorAll('.js-row-check').forEach(b => { b.checked = this.checked; });
  syncBulkBar();
});

document.getElementById('bulkClearBtn').addEventListener('click', () => {
  selectedIds.clear();
  document.querySelectorAll('.js-row-check').forEach(b => { b.checked = false; });
  document.getElementById('checkAll').checked = false;
  syncBulkBar();
});

document.getElementById('bulkApplyBtn').addEventListener('click', async function () {
  const ids = Array.from(selectedIds);
  const who = document.getElementById('bulkAssignee').value;
  const statusEl = document.getElementById('bulkStatus');

  if (ids.length === 0) return;
  const visibleIds = new Set(filterDeals().map(d => d.id));
  const hidden = ids.filter(id => !visibleIds.has(id)).length;
  const extra = hidden > 0
    ? `\n\n(이 중 ${hidden}건은 현재 화면에 보이지 않는 딜입니다)`
    : '';
  if (!confirm(`${ids.length}건의 담당자를 '${who}'(으)로 변경하시겠습니까?${extra}`)) return;

  this.disabled = true;
  const label = this.innerHTML;
  this.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>변경 중...';
  statusEl.className = 'ms-2 text-muted';
  statusEl.textContent = '';

  try {
    const n = await bulkUpdateAssignee(ids, who);

    // 화면이 들고 있는 목록도 같이 고쳐, 다시 불러오지 않고 바로 반영합니다.
    const set = new Set(ids);
    allDeals.forEach(d => { if (set.has(d.id)) d.assigned_to = who; });

    selectedIds.clear();
    document.getElementById('checkAll').checked = false;
    applyFilters();
    showToast(`${n}건의 담당자를 '${escapeHtml(who)}'(으)로 변경했습니다.`, 'success');
  } catch (err) {
    statusEl.className = 'ms-2 text-danger';
    statusEl.textContent = '변경 실패: ' + err.message;
  } finally {
    this.disabled = false;
    this.innerHTML = label;
  }
});

// ── 칸반 뷰 ────────────────────────────────────────────────────

const STAGE_COL_COLOR = {
  '접수':    '#78909c', '1차검토':'#1a237e', '심층검토':'#e65100',
  'IC':      '#0277bd', '투자확정':'#2e7d32', '패스':    '#c62828'
};

function daysSince(dateStr) {
  if (!dateStr) return null;
  const diff = Date.now() - new Date(dateStr).getTime();
  return Math.floor(diff / 86400000);
}

function kanbanCardHTML(d) {
  const days = daysSince(d.intake_date || d.created_at);
  const overdue = isOverdue(d.next_action_due);
  return `
    <div class="kanban-card${overdue ? ' kc-overdue' : ''}"
      draggable="true"
      data-id="${d.id}"
      ondragstart="onDragStart(event,'${d.id}')"
      ondragend="onDragEnd(event)"
      onclick="location.href='deal-detail.html?id=${d.id}'">
      <div class="kc-name">${escapeHtml(d.deal_name)}</div>
      <div class="kc-badges">${assetBadge(d.asset_class)}${dealStatus(d) !== DEFAULT_REVIEW_STATUS ? ' ' + statusBadge(dealStatus(d)) : ''}</div>
      <div class="kc-meta">
        <span><i class="fas fa-user me-1"></i>${escapeHtml(d.assigned_to)}</span>
        ${d.deal_size ? `<span>${formatCurrency(d.deal_size)}</span>` : ''}
      </div>
      ${d.next_action ? `<div class="kc-next-action"><i class="fas fa-arrow-right me-1"></i>${escapeHtml(d.next_action)} · ${nextActionDueHTML(d.next_action_due)}</div>` : ''}
      ${d.pass_reason ? `<div class="kc-next-action"><i class="fas fa-ban me-1"></i>패스 사유: ${escapeHtml(d.pass_reason)}</div>` : ''}
      ${days !== null ? `<div class="kc-days">접수 ${days}일째</div>` : ''}
      ${d.final_result ? `<div class="mt-1">${resultBadge(d.final_result)}</div>` : ''}
    </div>`;
}

function renderKanban(deals) {
  const board  = document.getElementById('kanbanBoard');
  const empty  = document.getElementById('kanbanEmpty');

  if (deals.length === 0) {
    board.innerHTML = '';
    empty.classList.remove('d-none');
    return;
  }
  empty.classList.add('d-none');

  const byStage = {};
  STAGES.forEach(s => byStage[s] = []);
  deals.forEach(d => { if (byStage[d.current_stage]) byStage[d.current_stage].push(d); });

  board.innerHTML = STAGES.map(stage => {
    const col = STAGE_COL_COLOR[stage] || '#999';
    const cards = byStage[stage];
    return `
      <div class="kanban-col"
        data-stage="${stage}"
        ondragover="onDragOver(event)"
        ondragleave="onDragLeave(event)"
        ondrop="onDrop(event,'${stage}')">
        <div class="kanban-col-header" style="border-top:3px solid ${col}">
          <span style="font-weight:700;font-size:13px">${stage}</span>
          <span class="kanban-count" style="background:${col}">${cards.length}</span>
        </div>
        <div class="kanban-cards">
          ${cards.length === 0
            ? '<div class="kanban-empty-col">딜 없음</div>'
            : cards.map(kanbanCardHTML).join('')}
        </div>
      </div>`;
  }).join('');
}

// ── 드래그 앤 드롭 ─────────────────────────────────────────────

function onDragStart(e, id) {
  dragSrcId = id;
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.classList.add('dragging');
}

function onDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-over'));
}

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.closest('.kanban-col').classList.add('drag-over');
}

function onDragLeave(e) {
  if (!e.currentTarget.contains(e.relatedTarget)) {
    e.currentTarget.closest('.kanban-col').classList.remove('drag-over');
  }
}

async function onDrop(e, newStage) {
  e.preventDefault();
  const col = e.currentTarget.closest('.kanban-col');
  col.classList.remove('drag-over');
  if (!dragSrcId) return;

  const deal = allDeals.find(d => d.id === dragSrcId);
  if (!deal || deal.current_stage === newStage) { dragSrcId = null; return; }

  if (newStage === '패스') { openPassModal(dragSrcId); dragSrcId = null; return; }

  try {
    await changeStage(dragSrcId, newStage);
    deal.current_stage = newStage;
    showToast(`"${escapeHtml(deal.deal_name)}" → ${escapeHtml(newStage)}`, 'success');
    applyFilters();
  } catch(err) {
    showToast('단계 변경 실패: ' + err.message, 'danger');
  }
  dragSrcId = null;
}

// ── 패스 사유 (칸반에서 '패스' 컬럼으로 드래그했을 때) ────────────

let passReasonModal = null;
let passTargetId = null;

function openPassModal(dealId) {
  passTargetId = dealId;
  const deal = allDeals.find(d => d.id === dealId);
  const sel = document.getElementById('pr_reason');
  if (sel.options.length === 1) {
    PASS_REASONS.forEach(r => {
      const o = document.createElement('option'); o.value = o.textContent = r; sel.appendChild(o);
    });
  }
  sel.value = deal.pass_reason || '';
  document.getElementById('pr_note').value      = deal.pass_reason_note || '';
  document.getElementById('pr_condition').value = deal.reconsider_condition || '';
  if (!passReasonModal) passReasonModal = new bootstrap.Modal(document.getElementById('passReasonModal'));
  passReasonModal.show();
}

async function confirmPassReason() {
  if (!passTargetId) return;
  const updated = {
    current_stage:        '패스',
    review_status:         '종결',
    pass_reason:           document.getElementById('pr_reason').value || null,
    pass_reason_note:      document.getElementById('pr_note').value.trim() || null,
    reconsider_condition:  document.getElementById('pr_condition').value.trim() || null,
  };
  try {
    const saved = await updateDeal(passTargetId, updated);
    await tryAddStageHistory(passTargetId, '패스', currentUserName());
    const idx = allDeals.findIndex(d => d.id === passTargetId);
    if (idx !== -1) allDeals[idx] = saved;
    passReasonModal.hide();
    showToast(`"${escapeHtml(saved.deal_name)}" → 패스`, 'success');
    applyFilters();
  } catch(e) {
    showToast('처리 실패: ' + e.message, 'danger');
  }
  passTargetId = null;
}

// ── 삭제 ───────────────────────────────────────────────────────

function openDeleteModal(id, name) {
  deleteTargetId = id;
  document.getElementById('deleteDealName').textContent = name;
  deleteModal.show();
}

document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
  if (!deleteTargetId) return;
  try {
    await deleteDeal(deleteTargetId);
    deleteModal.hide();
    showToast('딜이 삭제되었습니다.', 'success');
    allDeals = allDeals.filter(d => d.id !== deleteTargetId);
    deleteTargetId = null;
    applyFilters();
  } catch(e) {
    showToast('삭제 실패: ' + e.message, 'danger');
  }
});

// ── URL 파라미터 ────────────────────────────────────────────────

function loadUrlParams() {
  const p = new URLSearchParams(window.location.search);
  if (p.get('stage'))       document.getElementById('filterStage').value    = p.get('stage');
  if (p.get('asset_class')) document.getElementById('filterAsset').value    = p.get('asset_class');
  if (p.get('assigned_to')) document.getElementById('filterAssignee').value = p.get('assigned_to');
  if (p.get('status'))      document.getElementById('filterStatus').value   = p.get('status');
  if (p.get('view') === 'kanban') setView('kanban');
}

// 삭제 버튼 (이벤트 위임)
// 예전에는 버튼의 onclick 속성에 딜명을 문자열로 끼워 넣었습니다.
// 딜명에 따옴표가 들어가면 속성을 벗어나 임의 코드가 실행될 수 있어,
// data-* 속성에서 값을 읽는 방식으로 바꿨습니다.
//
// ※ 'true'(캡처 단계)로 등록하는 이유: 표의 <tr> 에 상세화면으로 이동하는
//   onclick 이 달려 있습니다. 거품 단계로 등록하면 행 이동이 먼저 일어나
//   삭제 모달이 뜨지 않습니다. 캡처 단계가 먼저 실행되므로 여기서 멈춥니다.
document.getElementById('dealsBody').addEventListener('click', function (e) {
  const btn = e.target.closest('.js-delete-deal');
  if (!btn) return;
  e.preventDefault();
  e.stopPropagation();
  openDeleteModal(btn.dataset.id, btn.dataset.name);
}, true);

// 이벤트
['filterSearch','filterAsset','filterStage','filterAssignee','filterStatus'].forEach(id => {
  document.getElementById(id).addEventListener('input', applyFilters);
  document.getElementById(id).addEventListener('change', applyFilters);
});

// 초기화
(async () => {
  const initNavId = new URLSearchParams(window.location.search).get('view') === 'kanban' ? 'kanban' : 'deals';
  renderNav(initNavId);
  buildFilters();
  buildBulkAssigneeOptions();
  loadUrlParams();
  try {
    allDeals = await getDeals();
    applyFilters();
  } catch(e) {
    showToast('데이터 로드 오류: ' + e.message, 'danger');
    document.getElementById('dealCount').textContent = '로드 실패';
  }
})();
</script>
</body>
