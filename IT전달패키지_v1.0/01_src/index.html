<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>딜 관리 시스템 – 대시보드</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="sidebar"></div>

<div id="main">
  <div class="page-header">
    <div>
      <h1 class="page-title"><i class="fas fa-chart-pie me-2" style="color:#1a237e"></i>대시보드</h1>
      <p class="page-sub" id="todayDate"></p>
    </div>
    <a href="deal-new.html" class="btn btn-primary">
      <i class="fas fa-plus me-1"></i> 새 딜 입력
    </a>
  </div>

  <div class="content-area">

    <!-- 통계 카드 -->
    <div class="row g-3 mb-4">
      <div class="col-md-3 col-6">
        <div class="stat-card">
          <div class="stat-icon" style="background:#1a237e"><i class="fas fa-briefcase"></i></div>
          <div>
            <div class="stat-value" id="statTotal">-</div>
            <div class="stat-label">전체 딜</div>
          </div>
        </div>
      </div>
      <div class="col-md-3 col-6">
        <div class="stat-card">
          <div class="stat-icon" style="background:#1976d2"><i class="fas fa-search"></i></div>
          <div>
            <div class="stat-value" id="statReview">-</div>
            <div class="stat-label">검토 중</div>
          </div>
        </div>
      </div>
      <div class="col-md-3 col-6">
        <div class="stat-card">
          <div class="stat-icon" style="background:#2e7d32"><i class="fas fa-check-circle"></i></div>
          <div>
            <div class="stat-value" id="statConfirmed">-</div>
            <div class="stat-label">투자확정</div>
          </div>
        </div>
      </div>
      <div class="col-md-3 col-6">
        <div class="stat-card">
          <div class="stat-icon" style="background:#f57c00"><i class="fas fa-calendar-plus"></i></div>
          <div>
            <div class="stat-value" id="statThisMonth">-</div>
            <div class="stat-label">이번 달 신규</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 딜 소싱 → 투자 전환 퍼널 -->
    <div class="card mb-4">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="fas fa-filter me-2"></i>딜 소싱 → 투자 전환 퍼널</span>
        <select id="funnelPeriod" class="form-select form-select-sm" style="width:auto"></select>
      </div>
      <div class="card-body">
        <div class="d-flex flex-wrap align-items-center" style="gap:28px">
          <div id="funnelSvgWrap" class="flex-shrink-0"></div>
          <div id="funnelList" class="flex-grow-1" style="min-width:260px"></div>
        </div>
        <div id="funnelEmpty" class="text-center text-muted py-4 d-none">
          <i class="fas fa-inbox d-block mb-2"></i>이 기간에 접수된 딜이 없습니다.
        </div>
      </div>
    </div>

    <!-- 다음 액션 현황 -->
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card h-100">
          <div class="card-header"><i class="fas fa-user-clock me-2"></i>내가 처리할 딜</div>
          <div class="card-body p-0"><div id="myActionList"></div></div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card h-100">
          <div class="card-header"><i class="fas fa-exclamation-circle me-2"></i>기한 임박·초과 (7일 이내)</div>
          <div class="card-body p-0"><div id="dueSoonList"></div></div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card h-100">
          <div class="card-header"><i class="fas fa-pause-circle me-2"></i>보류·외부회신 대기</div>
          <div class="card-body p-0"><div id="stalledList"></div></div>
        </div>
      </div>
    </div>

    <!-- 차트 + 단계별 분포 -->
    <div class="row g-3 mb-4">
      <div class="col-md-5">
        <div class="card h-100">
          <div class="card-header"><i class="fas fa-layer-group me-2"></i>자산군별 분포</div>
          <div class="card-body d-flex align-items-center justify-content-center">
            <div class="chart-wrap w-100"><canvas id="chartAsset"></canvas></div>
          </div>
        </div>
      </div>
      <div class="col-md-7">
        <div class="card h-100">
          <div class="card-header"><i class="fas fa-sitemap me-2"></i>검토 단계별 현황</div>
          <div class="card-body">
            <div class="chart-wrap"><canvas id="chartStage"></canvas></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 단계별 빠른 현황 -->
    <div class="card mb-4">
      <div class="card-header"><i class="fas fa-columns me-2"></i>단계별 딜 현황</div>
      <div class="card-body p-0">
        <div class="row g-0" id="stageSummaryRow" style="text-align:center"></div>
      </div>
    </div>

    <!-- 최근 딜 목록 -->
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="fas fa-clock me-2"></i>최근 접수 딜</span>
        <a href="deals.html" class="btn btn-sm btn-outline-primary">전체 보기</a>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table mb-0">
            <thead>
              <tr>
                <th>딜명</th><th>자산군</th><th>담당자</th>
                <th>딜 규모</th><th>현재 단계</th><th>인입일</th>
              </tr>
            </thead>
            <tbody id="recentDealsBody"></tbody>
          </table>
        </div>
        <div id="recentEmpty" class="empty-state d-none">
          <i class="fas fa-inbox d-block"></i>
          <p>딜이 없습니다</p>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="vendor/chartjs/chart.umd.min.js"></script>
<script src="vendor/supabase/supabase.js"></script>
<script src="js/config.js"></script>
<script>
  // 라이브 모드에서는 실제 딜 데이터가 담긴 seed-data.js를 아예 내려받지
  // 않습니다. 로그인 전 화면에서도 받아가던 파일이라, 대외비 데이터 노출을
  // 막기 위해 데모 모드일 때만 불러옵니다.
  if (DEMO_MODE) document.write('<script src="js/seed-data.js"><\/script>');
</script>
<script src="js/common.js"></script>
<script>
(async () => {
  renderNav('dashboard');

  const now = new Date();
  document.getElementById('todayDate').textContent =
    `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 기준`;

  const deals = await getDeals();

  // 통계
  const reviewing = deals.filter(d => ['1차검토','심층검토','IC'].includes(d.current_stage));
  const confirmed = deals.filter(d => d.current_stage === '투자확정');
  const thisMonth = deals.filter(d => {
    const d2 = new Date(d.intake_date || d.created_at);
    return d2.getFullYear() === now.getFullYear() && d2.getMonth() === now.getMonth();
  });

  document.getElementById('statTotal').textContent = deals.length;
  document.getElementById('statReview').textContent = reviewing.length;
  document.getElementById('statConfirmed').textContent = confirmed.length;
  document.getElementById('statThisMonth').textContent = thisMonth.length;

  // 딜 소싱 → 투자 전환 퍼널
  // 사용자가 올려준 참고 이미지 스타일(위에서 아래로 화살표가 모여들고, 하늘색에서
  // 보라색으로 짙어지는 깔때기 + 번호 원이 세로선으로 이어진 표)을 따라 그립니다.
  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }
  function lerpColor(a, b, t) {
    const ca = hexToRgb(a), cb = hexToRgb(b);
    const r = Math.round(ca.r + (cb.r - ca.r) * t);
    const g = Math.round(ca.g + (cb.g - ca.g) * t);
    const bl = Math.round(ca.b + (cb.b - ca.b) * t);
    return `rgb(${r},${g},${bl})`;
  }
  // 하늘색(위, 딜 소싱) → 보라색(아래, 투자확정)으로 점점 짙어지는 그라데이션
  const funnelColors = FUNNEL_STAGES.map((_, i) => lerpColor('#8ecae6', '#5e3a8c', i / (FUNNEL_STAGES.length - 1)));

  function buildFunnelSvg(stages) {
    const width = 220, segH = 42, gap = 4, arrowsH = 26;
    const funnelH = stages.length * segH + (stages.length - 1) * gap;
    const height = arrowsH + funnelH;
    const maxW = width - 16;
    const clamp = (pct) => Math.max(pct, 10); // 0%여도 띠가 눈에 보이게 최소 폭 확보
    const parts = [];

    // 위에서 모여드는 화살표 3개 (딜이 들어오는 느낌)
    [0.28, 0.5, 0.72].forEach(f => {
      const x = width * f;
      parts.push(`<path d="M ${x - 8},0 L ${x},14 L ${x + 8},0" stroke="#5c6bc0" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>`);
    });

    let y = arrowsH;
    stages.forEach((s, i) => {
      const topPct = clamp(s.pct);
      const nextPct = i < stages.length - 1 ? clamp(stages[i + 1].pct) : topPct;
      const topW = (topPct / 100) * maxW, botW = (nextPct / 100) * maxW;
      const topX1 = (width - topW) / 2, topX2 = topX1 + topW;
      const botX1 = (width - botW) / 2, botX2 = botX1 + botW;
      const yTop = y, yBot = y + segH;
      parts.push(`<polygon points="${topX1},${yTop} ${topX2},${yTop} ${botX2},${yBot} ${botX1},${yBot}" fill="${funnelColors[i]}"/>`);
      parts.push(`<text x="${width / 2}" y="${yTop + segH / 2 + 4}" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">${s.count}</text>`);
      y += segH + gap;
    });
    return `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}">${parts.join('')}</svg>`;
  }

  async function loadFunnel(periodValue) {
    const svgWrap = document.getElementById('funnelSvgWrap');
    const listEl = document.getElementById('funnelList');
    const emptyEl = document.getElementById('funnelEmpty');
    try {
      const result = await getDealFunnelStats(periodValue);
      if (result.total === 0) {
        svgWrap.innerHTML = '';
        listEl.innerHTML = '';
        emptyEl.classList.remove('d-none');
        return;
      }
      emptyEl.classList.add('d-none');
      svgWrap.innerHTML = buildFunnelSvg(result.stages);
      // 번호 원을 세로선으로 이어서(참고 이미지의 단계 표처럼) 보여줍니다.
      listEl.innerHTML = `
        <div style="position:relative">
          <div style="position:absolute;left:11px;top:12px;bottom:12px;width:2px;background:var(--border)"></div>
          ${result.stages.map((s, i) => `
          <div class="d-flex align-items-center mb-2" style="gap:10px;position:relative">
            <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
                 style="width:24px;height:24px;background:${funnelColors[i]};color:#fff;font-size:11px;font-weight:700">${i + 1}</div>
            <div class="fw-semibold" style="width:84px;font-size:13px">${escapeHtml(s.name)}</div>
            <div class="flex-grow-1">
              <div class="progress" style="height:8px;background:#eef1f6">
                <div class="progress-bar" style="width:${s.pct}%;background:${funnelColors[i]}"></div>
              </div>
            </div>
            <div style="width:100px;text-align:right" class="small">
              <strong>${s.count}건</strong> <span class="text-muted">(${s.pct}%)</span>
            </div>
          </div>`).join('')}
        </div>`;
    } catch (err) {
      listEl.innerHTML = `<div class="alert alert-danger">퍼널 불러오기 실패: ${escapeHtml(err.message)}</div>`;
    }
  }

  const funnelSel = document.getElementById('funnelPeriod');
  const funnelQuarters = listFunnelQuarters();
  funnelSel.innerHTML = funnelQuarters.map(q => `<option value="${q.value}">${escapeHtml(q.label)}</option>`).join('')
    + '<option value="all">전체 기간</option>';
  funnelSel.value = funnelQuarters.length ? funnelQuarters[0].value : 'all';
  funnelSel.onchange = () => loadFunnel(funnelSel.value);
  loadFunnel(funnelSel.value);

  // 다음 액션 현황
  function renderActionList(containerId, list, emptyMsg) {
    const el = document.getElementById(containerId);
    if (list.length === 0) {
      el.innerHTML = `<p class="text-muted text-center py-4 mb-0" style="font-size:13px">${emptyMsg}</p>`;
      return;
    }
    el.innerHTML = list.slice(0, 8).map(d => `
      <div class="action-row" onclick="location.href='deal-detail.html?id=${d.id}'">
        <div class="d-flex justify-content-between align-items-center">
          <strong style="font-size:13px">${escapeHtml(d.deal_name)}</strong>
          <span style="font-size:12px">${nextActionDueHTML(d.next_action_due)}</span>
        </div>
        <div class="text-muted" style="font-size:12px">${escapeHtml(d.next_action)}${d.next_action_owner ? ' · ' + escapeHtml(d.next_action_owner) : ''}</div>
      </div>`).join('');
  }

  const me = currentUserName();
  const myActions = deals
    .filter(d => d.next_action && d.next_action_owner === me)
    .sort((a, b) => (a.next_action_due || '9999-99-99').localeCompare(b.next_action_due || '9999-99-99'));
  renderActionList('myActionList', myActions, '내가 처리할 다음 액션이 없습니다.');

  const dueSoon = deals
    .filter(d => d.next_action && d.next_action_due && daysUntil(d.next_action_due) <= 7)
    .sort((a, b) => a.next_action_due.localeCompare(b.next_action_due));
  renderActionList('dueSoonList', dueSoon, '임박하거나 지난 기한이 없습니다.');

  const stalled = deals.filter(d => ['보류', '외부회신 대기'].includes(dealStatus(d)));
  const stalledEl = document.getElementById('stalledList');
  if (stalled.length === 0) {
    stalledEl.innerHTML = `<p class="text-muted text-center py-4 mb-0" style="font-size:13px">보류·대기 중인 딜이 없습니다.</p>`;
  } else {
    stalledEl.innerHTML = stalled.slice(0, 8).map(d => `
      <div class="action-row" onclick="location.href='deal-detail.html?id=${d.id}'">
        <div class="d-flex justify-content-between align-items-center">
          <strong style="font-size:13px">${escapeHtml(d.deal_name)}</strong>
          ${statusBadge(dealStatus(d))}
        </div>
        <div class="text-muted" style="font-size:12px">${stageBadge(d.current_stage)}${d.next_action_note ? ' · ' + escapeHtml(d.next_action_note) : ''}</div>
      </div>`).join('');
  }

  // 자산군 도넛 차트
  const assetCount = {};
  ASSET_CLASSES.forEach(a => assetCount[a] = 0);
  deals.forEach(d => { if (assetCount[d.asset_class] !== undefined) assetCount[d.asset_class]++; });
  const assetData = ASSET_CLASSES.filter(a => assetCount[a] > 0);
  new Chart(document.getElementById('chartAsset'), {
    type: 'doughnut',
    data: {
      labels: assetData,
      datasets: [{
        data: assetData.map(a => assetCount[a]),
        backgroundColor: assetData.map(a => ASSET_COLOR[a]),
        borderWidth: 2, borderColor: '#fff'
      }]
    },
    options: { plugins:{ legend:{ position:'right', labels:{ font:{size:12}, padding:10 } } }, maintainAspectRatio:false }
  });

  // 단계 막대 차트
  const stageCount = {};
  STAGES.forEach(s => stageCount[s] = 0);
  deals.forEach(d => { if (stageCount[d.current_stage] !== undefined) stageCount[d.current_stage]++; });
  const stageBgColors = ['#9e9e9e','#1a237e','#f57c00','#0288d1','#2e7d32','#c62828'];
  new Chart(document.getElementById('chartStage'), {
    type: 'bar',
    data: {
      labels: STAGES,
      datasets: [{ data: STAGES.map(s => stageCount[s]), backgroundColor: stageBgColors, borderRadius: 6, borderSkipped: false }]
    },
    options: {
      plugins: { legend:{ display:false } },
      scales: { y:{ beginAtZero:true, ticks:{ stepSize:1 } } },
      maintainAspectRatio: false
    }
  });

  // 단계별 요약
  const summaryRow = document.getElementById('stageSummaryRow');
  STAGES.forEach((s, i) => {
    const cnt = stageCount[s];
    const col = stageBgColors[i];
    const div = document.createElement('div');
    div.className = 'col border-end py-3';
    div.style.cursor = 'pointer';
    div.innerHTML = `
      <div style="font-size:22px;font-weight:700;color:${col}">${cnt}</div>
      <div style="font-size:11px;color:#6c757d;margin-top:2px">${s}</div>`;
    div.onclick = () => { window.location.href = `deals.html?stage=${encodeURIComponent(s)}`; };
    summaryRow.appendChild(div);
  });

  // 최근 딜 목록 (최대 8개)
  const tbody = document.getElementById('recentDealsBody');
  const recent = deals.slice(0, 8);
  if (recent.length === 0) {
    document.getElementById('recentEmpty').classList.remove('d-none');
  } else {
    tbody.innerHTML = recent.map(d => `
      <tr onclick="location.href='deal-detail.html?id=${d.id}'">
        <td><strong>${escapeHtml(d.deal_name)}</strong></td>
        <td>${assetBadge(d.asset_class)}</td>
        <td>${escapeHtml(d.assigned_to)}</td>
        <td>${formatCurrency(d.deal_size)}</td>
        <td>${stageBadge(d.current_stage)}</td>
        <td>${formatDate(d.intake_date)}</td>
      </tr>`).join('');
  }
})();
</script>
</body>
</html>
