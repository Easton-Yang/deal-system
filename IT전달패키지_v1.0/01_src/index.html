<script>
  // 라이브 모드에서는 실제 딜 데이터가 담긴 seed-data.js를 아예 내려받지
  // 않습니다. 로그인 전 화면에서도 받아가던 파일이라, 대외비 데이터 노출을
  // 막기 위해 데모 모드일 때만 불러옵니다.
  if (DEMO_MODE) document.write('<script src="js/seed-data.js"><\/script>');
</script>
<script src="js/common.js"></script>
<script>
(async () => {
  renderNav('dashboard');

  const now = new Date();
  document.getElementById('todayDate').textContent =
    `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 기준`;

  const deals = await getDeals();

  // 통계
  const reviewing = deals.filter(d => ['1차검토','심층검토','IC'].includes(d.current_stage));
  const confirmed = deals.filter(d => d.current_stage === '투자확정');
  const thisMonth = deals.filter(d => {
    const d2 = new Date(d.intake_date || d.created_at);
    return d2.getFullYear() === now.getFullYear() && d2.getMonth() === now.getMonth();
  });

  document.getElementById('statTotal').textContent = deals.length;
  document.getElementById('statReview').textContent = reviewing.length;
  document.getElementById('statConfirmed').textContent = confirmed.length;
  document.getElementById('statThisMonth').textContent = thisMonth.length;

  // 딜 소싱 → 투자 전환 퍼널
  // 색은 하늘색(위, 딜 소싱)에서 보라색(아래, 투자확정)으로 점점 짙어지는
  // 그라데이션을 씁니다. 리본처럼 보이도록 각 띠에 세로 그라데이션 +
  // 윗면 하이라이트 선 + 그림자를 넣었습니다(참고 이미지는 디자인 느낌만
  // 참고했고 그대로 그리지 않았습니다 — 저작권이 있는 스톡 이미지입니다).
  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }
  function lerpColor(a, b, t) {
    const ca = hexToRgb(a), cb = hexToRgb(b);
    const r = Math.round(ca.r + (cb.r - ca.r) * t);
    const g = Math.round(ca.g + (cb.g - ca.g) * t);
    const bl = Math.round(ca.b + (cb.b - ca.b) * t);
    return `rgb(${r},${g},${bl})`;
  }
  // rgb(...) 문자열을 흰색 쪽으로 amt(0~1)만큼 밝게 만듭니다(띠 윗부분 광택용).
  function lightenRgb(rgbStr, amt) {
    const [r, g, b] = rgbStr.match(/\d+/g).map(Number);
    const mix = (c) => Math.max(0, Math.min(255, Math.round(c + (255 - c) * amt)));
    return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
  }
  const funnelColors = FUNNEL_STAGES.map((_, i) => lerpColor('#8ecae6', '#5e3a8c', i / (FUNNEL_STAGES.length - 1)));

  // 띠(사다리꼴)들의 좌표를 미리 계산해 둡니다 — SVG를 그릴 때도, 공 애니메이션이
  // 각 단계의 정확한 위치로 떨어지게 할 때도 똑같은 좌표를 씁니다.
  // 모양 자체는 데이터와 상관없이 깔끔한 역삼각형(위는 꽉 찬 폭, 아래는 뾰족한
  // 점까지 일정하게 좁아짐)으로 고정했습니다. 실제 단계별 수치는 모양이 아니라
  // 공 애니메이션 개수와 오른쪽 표로 보여줍니다.
  function computeFunnelGeometry(stages) {
    const width = 220, segH = 44, arrowsH = 26;
    const maxW = width - 16;
    const n = stages.length;
    const totalH = segH * n;
    const bands = [];
    for (let i = 0; i < n; i++) {
      const yTopRel = i * segH, yBotRel = (i + 1) * segH;
      const topW = maxW * (1 - yTopRel / totalH);
      const botW = maxW * (1 - yBotRel / totalH); // 마지막 띠는 자연히 0(뾰족한 꼭짓점)
      const topX1 = (width - topW) / 2, topX2 = topX1 + topW;
      const botX1 = (width - botW) / 2, botX2 = botX1 + botW;
      bands.push({ topX1, topX2, botX1, botX2, yTop: arrowsH + yTopRel, yBot: arrowsH + yBotRel });
    }
    const height = arrowsH + totalH;
    return { width, height, arrowsH, segH, maxW, totalH, bands };
  }

  // 역삼각형 안의 임의의 y 높이에서 폭이 얼마인지 (공을 띠 폭 안에 들어가게 배치할 때 씀)
  function funnelWidthAtY(geo, y) {
    const yRel = Math.min(Math.max(y - geo.arrowsH, 0), geo.totalH);
    return geo.maxW * (1 - yRel / geo.totalH);
  }

  function buildFunnelSvgMarkup(stages, geo) {
    const { width, height, bands } = geo;
    const parts = [];
    parts.push('<defs>' + funnelColors.map((c, i) =>
      `<linearGradient id="fg${i}" x1="0" y1="0" x2="0" y2="1">
         <stop offset="0" stop-color="${lightenRgb(c, 0.35)}"/>
         <stop offset="1" stop-color="${c}"/>
       </linearGradient>`).join('') + '</defs>');

    // 위에서 모여드는 화살표 3개 (딜이 들어오는 느낌)
    [0.28, 0.5, 0.72].forEach(f => {
      const x = width * f;
      parts.push(`<path d="M ${x - 8},0 L ${x},14 L ${x + 8},0" stroke="#5c6bc0" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>`);
    });

    // 띠는 겹치는 순서로 그려서 이음매가 자연스럽게 보이게 하고, 사이에 얇은
    // 흰 선을 하나씩 넣어 참고 이미지처럼 단계 구분만 살짝 보이게 합니다.
    bands.forEach((b, i) => {
      parts.push(`<polygon points="${b.topX1},${b.yTop} ${b.topX2},${b.yTop} ${b.botX2},${b.yBot} ${b.botX1},${b.yBot}" fill="url(#fg${i})"/>`);
      if (i > 0) parts.push(`<line x1="${b.topX1}" y1="${b.yTop}" x2="${b.topX2}" y2="${b.yTop}" stroke="rgba(255,255,255,.5)" stroke-width="1.5"/>`);
    });
    return `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" style="filter:drop-shadow(0 4px 8px rgba(26,35,126,.18))">${parts.join('')}</svg>`;
  }

  // ── 공 흐르는 애니메이션 ──────────────────────────────────────
  // 공 하나하나가 실제 딜 한 건과 연결됩니다(common.js의 getDealFunnelStats()가
  // 돌려주는 deals 목록 — 딜마다 어느 단계까지 도달했는지가 stopStage로 들어있음).
  // 클릭하면 그 딜의 상세화면으로 이동합니다.

  // 한 단계에 쌓일 공들을 그 띠 안에 무작위로 흩뿌립니다(한 줄로 가지런히
  // 세우지 않음). 공끼리 너무 겹치지 않도록, 자리마다 몇 번 다시 뽑아보고
  // (거부 샘플링) 그래도 안 되면 그냥 놓습니다 — 약간 겹쳐도 장식용이라 무방.
  function funnelLandingSlots(geo, stageIdx, count) {
    if (count <= 0) return [];
    const b = geo.bands[stageIdx];
    const pad = 6;
    const yMin = b.yTop + pad, yMax = Math.max(b.yBot - pad, yMin + 1);
    const minDist = 10.5;
    const maxAttempts = 40;
    const randomPoint = () => {
      const y = yMin + Math.random() * (yMax - yMin);
      const w = Math.max(funnelWidthAtY(geo, y) - pad * 2, 10);
      const x = geo.width / 2 + (Math.random() - 0.5) * w;
      return { x, y };
    };
    const slots = [];
    for (let k = 0; k < count; k++) {
      let picked = null;
      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        const p = randomPoint();
        const ok = slots.every(s => {
          const dx = s.x - p.x, dy = s.y - p.y;
          return dx * dx + dy * dy >= minDist * minDist;
        });
        if (ok) { picked = p; break; }
      }
      slots.push(picked || randomPoint());
    }
    return slots;
  }

  // '드랍'된 딜의 공이 깔때기 밖으로 튕겨나가 멈추는 자리를 계산합니다.
  // 같은 단계에서 드랍된 공이 여러 개면 좌우로 번갈아, 바깥쪽으로 조금씩
  // 더 멀리 자리를 잡아 서로 겹치지 않게 합니다.
  function funnelEjectSlot(geo, stageIdx, index) {
    const b = geo.bands[stageIdx];
    const y = b.yTop + geo.segH * 0.55 + (index % 3) * 9;
    const side = index % 2 === 0 ? -1 : 1;
    const ringW = funnelWidthAtY(geo, y);
    const margin = 10 + Math.floor(index / 2) * 12;
    let x = geo.width / 2 + side * (ringW / 2 + margin);
    x = Math.min(Math.max(x, 8), geo.width - 8); // 카드 밖으로 넘어가지 않게
    return { x, y };
  }

  async function animateFunnelBall(el, waypoints, myEpoch, getEpoch) {
    el.classList.add('show');
    for (const wp of waypoints) {
      if (getEpoch() !== myEpoch) return; // 기간이 바뀌는 등으로 중단되면 더 진행하지 않음
      el.style.left = wp.x + 'px';
      el.style.top = wp.y + 'px';
      await new Promise(r => setTimeout(r, 190));
    }
  }

  let funnelEpoch = 0;

  // dealBalls: common.js getDealFunnelStats()의 deals 목록 ({id, deal_name, stopStage}).
  // 공 애니메이션은 화면에 뜰 때(또는 기간을 바꿀 때) 딱 한 번만 재생되고, 다 떨어진
  // 뒤에는 그 자리에 그대로 멈춰 있습니다(반복 재생 안 함).
  function startFunnelBallLoop(dealBalls, geo, ballLayer, tooltipEl) {
    funnelEpoch++; // 기간을 바꿔 다시 부르면, 이전에 떨어지던 중인 공은 여기서 멈춥니다
    const myEpoch = funnelEpoch;
    const spawnX = geo.width / 2, spawnY = geo.arrowsH - 6;

    ballLayer.innerHTML = '';
    if (tooltipEl) tooltipEl.classList.remove('show');
    const total = dealBalls.length;
    if (total === 0) return;

    // 공이 많을 때(딜이 많은 기간)도 등장이 너무 늘어지지 않게 간격을 자동으로 줄입니다.
    const stagger = Math.max(12, Math.min(140, 1300 / total));

    // 깔때기 안에 쌓이는 공(안 드랍된 딜)과, 그 단계에서 밖으로 튕겨나가는
    // 공(드랍된 딜)을 따로 배치합니다.
    const stayedBalls = dealBalls.filter(db => !db.dropped);

    const byStage = {};
    stayedBalls.forEach(db => { (byStage[db.stopStage] = byStage[db.stopStage] || []).push(db); });
    const slotsByStage = {};
    Object.keys(byStage).forEach(s => { slotsByStage[s] = funnelLandingSlots(geo, Number(s), byStage[s].length); });
    const stayedCursor = {};
    const stayedSlotOf = (stageIdx) => {
      const idx = stayedCursor[stageIdx] || 0;
      stayedCursor[stageIdx] = idx + 1;
      return slotsByStage[stageIdx][idx];
    };

    const dropCursor = {};
    const dropSlotOf = (stageIdx) => {
      const idx = dropCursor[stageIdx] || 0;
      dropCursor[stageIdx] = idx + 1;
      return funnelEjectSlot(geo, stageIdx, idx);
    };

    dealBalls.forEach((db, j) => {
      const landing = db.dropped ? dropSlotOf(db.stopStage) : stayedSlotOf(db.stopStage);

      const el = document.createElement('div');
      el.className = 'funnel-ball' + (db.dropped ? ' dropped' : '');
      el.style.left = spawnX + 'px';
      el.style.top = spawnY + 'px';
      // 호버하면 바로 뜨는 말풍선(네이티브 title 속성은 뜨는 데 1초 안팎 걸려서
      // 안 보일 수 있었습니다 — Beta-11.7). textContent로 넣으므로 HTML 삽입이
      // 아니라 escapeHtml 없이도 안전합니다.
      el.addEventListener('mouseenter', () => {
        if (!tooltipEl) return;
        tooltipEl.textContent = db.deal_name || '';
        tooltipEl.style.left = el.style.left;
        tooltipEl.style.top = el.style.top;
        tooltipEl.classList.add('show');
      });
      el.addEventListener('mouseleave', () => {
        if (tooltipEl) tooltipEl.classList.remove('show');
      });
      el.addEventListener('click', (ev) => {
        ev.stopPropagation();
        window.location.href = `deal-detail.html?id=${db.id}`;
      });
      ballLayer.appendChild(el);

      // 드랍된 딜은 그 단계까지 깔때기 중앙으로 내려오다가, 마지막에 밖으로
      // 튕겨나가는 구간이 하나 더 붙습니다.
      const waypoints = [];
      for (let i = 0; i < db.stopStage; i++) {
        waypoints.push({ x: geo.width / 2, y: geo.bands[i].yBot - 2 });
      }
      if (db.dropped) waypoints.push({ x: geo.width / 2, y: geo.bands[db.stopStage].yTop + geo.segH * 0.3 });
      waypoints.push(landing);

      setTimeout(() => {
        animateFunnelBall(el, waypoints, myEpoch, () => funnelEpoch).then(() => {
          if (db.dropped && funnelEpoch === myEpoch) el.classList.add('landed');
        });
      }, j * stagger);
    });
  }

  async function loadFunnel(periodValue) {
    const svgWrap = document.getElementById('funnelSvgWrap');
    const listEl = document.getElementById('funnelList');
    const emptyEl = document.getElementById('funnelEmpty');
    try {
      const result = await getDealFunnelStats(periodValue);
      if (result.total === 0) {
        funnelEpoch++; // 진행 중이던 공 애니메이션 중단
        if (funnelCycleTimer) clearTimeout(funnelCycleTimer);
        svgWrap.innerHTML = '';
        listEl.innerHTML = '';
        emptyEl.classList.remove('d-none');
        return;
      }
      emptyEl.classList.add('d-none');
      const geo = computeFunnelGeometry(result.stages);
      // 네이티브 title 속성 말풍선은 뜨기까지 1초 안팎 걸리는데, 공이 몇 초마다
      // 통째로 다시 생기다 보니 뜰 시간이 빠듯해 안 보일 수 있었습니다(Beta-11.7).
      // 그래서 직접 그린 말풍선(funnelTooltip)으로 바꿔 올리자마자 바로 뜨게 했습니다.
      svgWrap.innerHTML = `<div style="position:relative;width:${geo.width}px;height:${geo.height}px">` +
        buildFunnelSvgMarkup(result.stages, geo) +
        `<div id="funnelBallLayer" style="position:absolute;inset:0;pointer-events:none"></div>` +
        `<div id="funnelTooltip" class="funnel-tooltip"></div></div>`;
      startFunnelBallLoop(result.deals, geo, document.getElementById('funnelBallLayer'), document.getElementById('funnelTooltip'));
      // 번호 원을 세로선으로 이어서(참고 이미지의 단계 표처럼) 보여줍니다.
      listEl.innerHTML = `
        <div style="position:relative">
          <div style="position:absolute;left:11px;top:12px;bottom:12px;width:2px;background:var(--border)"></div>
          ${result.stages.map((s, i) => `
          <div class="d-flex align-items-center mb-2" style="gap:10px;position:relative">
            <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
                 style="width:24px;height:24px;background:${funnelColors[i]};color:#fff;font-size:11px;font-weight:700">${i + 1}</div>
            <div class="fw-semibold" style="width:84px;font-size:13px">${escapeHtml(s.name)}</div>
            <div class="flex-grow-1">
              <div class="progress" style="height:8px;background:#eef1f6">
                <div class="progress-bar" style="width:${s.pct}%;background:${funnelColors[i]}"></div>
              </div>
            </div>
            <div style="width:100px;text-align:right" class="small">
              <strong>${s.count}건</strong> <span class="text-muted">(${s.pct}%)</span>
            </div>
          </div>`).join('')}
        </div>`;
    } catch (err) {
      listEl.innerHTML = `<div class="alert alert-danger">퍼널 불러오기 실패: ${escapeHtml(err.message)}</div>`;
    }
  }

  const funnelSel = document.getElementById('funnelPeriod');
  const funnelQuarters = listFunnelQuarters();
  funnelSel.innerHTML = funnelQuarters.map(q => `<option value="${q.value}">${escapeHtml(q.label)}</option>`).join('')
    + '<option value="all">전체 기간</option>';
  funnelSel.value = funnelQuarters.length ? funnelQuarters[0].value : 'all';
  funnelSel.onchange = () => loadFunnel(funnelSel.value);
  loadFunnel(funnelSel.value);

  // 다음 액션 현황
  function renderActionList(containerId, list, emptyMsg) {
    const el = document.getElementById(containerId);
    if (list.length === 0) {
      el.innerHTML = `<p class="text-muted text-center py-4 mb-0" style="font-size:13px">${emptyMsg}</p>`;
      return;
    }
    el.innerHTML = list.slice(0, 8).map(d => `
      <div class="action-row" onclick="location.href='deal-detail.html?id=${d.id}'">
        <div class="d-flex justify-content-between align-items-center">
          <strong style="font-size:13px">${escapeHtml(d.deal_name)}</strong>
          <span style="font-size:12px">${nextActionDueHTML(d.next_action_due)}</span>
        </div>
        <div class="text-muted" style="font-size:12px">${escapeHtml(d.next_action)}${d.next_action_owner ? ' · ' + escapeHtml(d.next_action_owner) : ''}</div>
      </div>`).join('');
  }

  const me = currentUserName();
  const myActions = deals
    .filter(d => d.next_action && d.next_action_owner === me)
    .sort((a, b) => (a.next_action_due || '9999-99-99').localeCompare(b.next_action_due || '9999-99-99'));
  renderActionList('myActionList', myActions, '내가 처리할 다음 액션이 없습니다.');

  const dueSoon = deals
    .filter(d => d.next_action && d.next_action_due && daysUntil(d.next_action_due) <= 7)
    .sort((a, b) => a.next_action_due.localeCompare(b.next_action_due));
  renderActionList('dueSoonList', dueSoon, '임박하거나 지난 기한이 없습니다.');

  const stalled = deals.filter(d => ['보류', '외부회신 대기'].includes(dealStatus(d)));
  const stalledEl = document.getElementById('stalledList');
  if (stalled.length === 0) {
    stalledEl.innerHTML = `<p class="text-muted text-center py-4 mb-0" style="font-size:13px">보류·대기 중인 딜이 없습니다.</p>`;
  } else {
    stalledEl.innerHTML = stalled.slice(0, 8).map(d => `
      <div class="action-row" onclick="location.href='deal-detail.html?id=${d.id}'">
        <div class="d-flex justify-content-between align-items-center">
          <strong style="font-size:13px">${escapeHtml(d.deal_name)}</strong>
          ${statusBadge(dealStatus(d))}
        </div>
        <div class="text-muted" style="font-size:12px">${stageBadge(d.current_stage)}${d.next_action_note ? ' · ' + escapeHtml(d.next_action_note) : ''}</div>
      </div>`).join('');
  }

  // 자산군 도넛 차트
  const assetCount = {};
  ASSET_CLASSES.forEach(a => assetCount[a] = 0);
  deals.forEach(d => { if (assetCount[d.asset_class] !== undefined) assetCount[d.asset_class]++; });
  const assetData = ASSET_CLASSES.filter(a => assetCount[a] > 0);
  new Chart(document.getElementById('chartAsset'), {
    type: 'doughnut',
    data: {
      labels: assetData,
      datasets: [{
        data: assetData.map(a => assetCount[a]),
        backgroundColor: assetData.map(a => ASSET_COLOR[a]),
        borderWidth: 2, borderColor: '#fff'
      }]
    },
    options: { plugins:{ legend:{ position:'right', labels:{ font:{size:12}, padding:10 } } }, maintainAspectRatio:false }
  });

  // 단계 막대 차트
  const stageCount = {};
  STAGES.forEach(s => stageCount[s] = 0);
  deals.forEach(d => { if (stageCount[d.current_stage] !== undefined) stageCount[d.current_stage]++; });
  const stageBgColors = ['#9e9e9e','#1a237e','#f57c00','#0288d1','#2e7d32','#c62828'];
  new Chart(document.getElementById('chartStage'), {
    type: 'bar',
    data: {
      labels: STAGES,
      datasets: [{ data: STAGES.map(s => stageCount[s]), backgroundColor: stageBgColors, borderRadius: 6, borderSkipped: false }]
    },
    options: {
      plugins: { legend:{ display:false } },
      scales: { y:{ beginAtZero:true, ticks:{ stepSize:1 } } },
      maintainAspectRatio: false
    }
  });

  // 단계별 요약
  const summaryRow = document.getElementById('stageSummaryRow');
  STAGES.forEach((s, i) => {
    const cnt = stageCount[s];
    const col = stageBgColors[i];
    const div = document.createElement('div');
    div.className = 'col border-end py-3';
    div.style.cursor = 'pointer';
    div.innerHTML = `
      <div style="font-size:22px;font-weight:700;color:${col}">${cnt}</div>
      <div style="font-size:11px;color:#6c757d;margin-top:2px">${s}</div>`;
    div.onclick = () => { window.location.href = `deals.html?stage=${encodeURIComponent(s)}`; };
    summaryRow.appendChild(div);
  });

  // 최근 딜 목록 (최대 8개)
  const tbody = document.getElementById('recentDealsBody');
  const recent = deals.slice(0, 8);
  if (recent.length === 0) {
    document.getElementById('recentEmpty').classList.remove('d-none');
  } else {
    tbody.innerHTML = recent.map(d => `
      <tr onclick="location.href='deal-detail.html?id=${d.id}'">
        <td><strong>${escapeHtml(d.deal_name)}</strong></td>
        <td>${assetBadge(d.asset_class)}</td>
        <td>${escapeHtml(d.assigned_to)}</td>
        <td>${formatCurrency(d.deal_size)}</td>
        <td>${stageBadge(d.current_stage)}</td>
        <td>${formatDate(d.intake_date)}</td>
      </tr>`).join('');
  }
})();
</script>
</body>
</html>
