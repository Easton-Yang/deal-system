<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>딜 관리 시스템 – 마이페이지</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="sidebar"></div>
<div id="main">
  <div class="page-header"><div><h1 class="page-title">마이페이지</h1><p class="page-sub">내 프로필과 비밀번호를 관리합니다.</p></div></div>
  <div class="content-area" style="max-width:1040px">
    <div id="pageStatus" role="status" aria-live="polite" class="mb-3 text-muted">내 정보를 불러오고 있습니다...</div>
    <div class="row g-4">
      <div class="col-lg-6">
        <section class="card h-100">
          <div class="card-header"><i class="fas fa-user-circle me-2"></i>내 프로필</div>
          <div class="card-body">
            <form id="profileForm">
              <fieldset id="profileFields" disabled>
                <div class="mb-3"><label for="profileEmail" class="form-label">로그인 이메일</label><input id="profileEmail" class="form-control bg-light" type="email" readonly autocomplete="email"><div class="form-text">계정에 등록된 이메일입니다.</div></div>
                <div class="mb-3"><label for="profileName" class="form-label">이름</label><input id="profileName" class="form-control" required maxlength="40" autocomplete="name"><div class="form-text">마이페이지와 왼쪽 하단에 표시됩니다. 딜의 담당자 지정은 유지됩니다.</div></div>
                <div class="mb-3"><label for="profileDepartment" class="form-label">부서 <span class="text-muted small">선택</span></label><input id="profileDepartment" class="form-control" maxlength="60" autocomplete="organization" placeholder="예: 자산운용팀"></div>
                <div class="mb-4"><label for="profileJobTitle" class="form-label">직함 <span class="text-muted small">선택</span></label><input id="profileJobTitle" class="form-control" maxlength="60" autocomplete="organization-title" placeholder="예: 팀장"></div>
                <button id="profileSave" class="btn btn-primary" type="submit">프로필 저장</button>
              </fieldset>
            </form>
            <div id="profileStatus" class="mt-3" role="status" aria-live="polite"></div>
          </div>
        </section>
      </div>
      <div class="col-lg-6">
        <section class="card h-100">
          <div class="card-header"><i class="fas fa-lock me-2"></i>비밀번호 변경</div>
          <div class="card-body">
            <p class="text-muted small">현재 비밀번호를 확인한 뒤 새 비밀번호로 변경합니다.</p>
            <form id="passwordForm">
              <fieldset id="passwordFields" disabled>
                <input id="passwordUsername" type="text" autocomplete="username" hidden>
                <div class="mb-3"><label for="currentPassword" class="form-label">현재 비밀번호</label><input id="currentPassword" class="form-control" type="password" autocomplete="current-password" required maxlength="128"></div>
                <div class="mb-3"><label for="newPassword" class="form-label">새 비밀번호</label><input id="newPassword" class="form-control" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><div class="form-text">8자 이상으로 입력해주세요.</div></div>
                <div class="mb-4"><label for="confirmPassword" class="form-label">새 비밀번호 확인</label><input id="confirmPassword" class="form-control" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></div>
                <button id="passwordSave" class="btn btn-primary" type="submit">비밀번호 변경</button>
              </fieldset>
            </form>
            <div id="passwordStatus" class="mt-3" role="status" aria-live="polite"></div>
          </div>
        </section>
      </div>
    </div>
    <div class="mt-4"><a href="admin.html" class="text-muted small"><i class="fas fa-database me-1"></i>데이터 백업·업로드 관리</a></div>
  </div>
</div>
<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="vendor/supabase/supabase.js"></script>
<script src="js/config.js"></script>
<script>if (DEMO_MODE) document.write('<script src="js/seed-data.js"><\/script>');</script>
<script src="js/common.js"></script>
<script src="js/mypage.js"></script>
</body>
</html>
