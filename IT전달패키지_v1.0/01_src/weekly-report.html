<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주간 보고 – 딜 관리 시스템</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="sidebar" class="no-print"></div>

<div id="main">
  <div class="page-header no-print">
    <div>
      <h1 class="page-title"><i class="fas fa-file-lines me-2" style="color:#1a237e"></i>주간 보고</h1>
      <p class="page-sub" id="weekRangeLabel">불러오는 중...</p>
    </div>
    <div class="d-flex gap-2 align-items-center">
      <button class="btn btn-sm btn-outline-secondary" onclick="changeWeek(-1)">
        <i class="fas fa-chevron-left me-1"></i>이전 주
      </button>
      <button class="btn btn-sm btn-outline-secondary" onclick="changeWeek(0)">이번 주</button>
      <button class="btn btn-sm btn-outline-secondary" onclick="changeWeek(1)">
        다음 주<i class="fas fa-chevron-right ms-1"></i>
      </button>
      <button class="btn btn-sm btn-primary" onclick="window.print()">
        <i class="fas fa-print me-1"></i>인쇄 / PDF로 저장
      </button>
    </div>
  </div>

  <div class="content-area">

    <!-- 인쇄 전용 표지(레터헤드) — 화면에는 숨기고, 인쇄/PDF에만 보입니다 -->
    <div class="print-only report-letterhead mb-3">
      <div class="report-letterhead-top">
        <img src="img/woongjin-preed-logo.png" alt="Woongjin PREED Life">
        <span id="reportPrintedAt"></span>
      </div>
      <h2 class="mb-2">자산운용팀 주간 업무보고</h2>
      <table class="report-meta-table">
        <tr>
          <th>보고기간</th><td id="weekRangeLabelPrint"></td>
          <th>작성</th><td id="reportAuthorPrint"></td>
        </tr>
      </table>
    </div>

    <div id="reportBody">
      <div class="text-center py-5 text-muted">
        <i class="fas fa-spinner fa-spin fa-2x"></i>
        <p class="mt-3">불러오는 중...</p>
      </div>
    </div>

  </div>
</div>

<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="vendor/supabase/supabase.js"></script>
<script src="js/config.js"></script>
<script>
  // 라이브 모드에서는 실제 딜 데이터가 담긴 seed-data.js를 아예 내려받지
  // 않습니다. 로그인 전 화면에서도 받아가던 파일이라, 대외비 데이터 노출을
  // 막기 위해 데모 모드일 때만 불러옵니다.
  if (DEMO_MODE) document.write('<script src="js/seed-data.js"><\/script>');
</script>
<script src="js/common.js"></script>
<script>
let weekOffset = 0;

// 월요일 시작 기준 주 범위. offset: 0=이번 주, -1=지난 주, +1=다음 주
function getWeekRange(offset) {
  const now = new Date();
  const day = now.getDay(); // 0=일 .. 6=토
  const diffToMonday = (day === 0 ? -6 : 1 - day);
  const start = new Date(now);
  start.setHours(0, 0, 0, 0);
  start.setDate(start.getDate() + diffToMonday + offset * 7);
  const end = new Date(start);
  end.setDate(start.getDate() + 6);
  end.setHours(23, 59, 59, 999);
  return { start, end };
}

function fmtRange(start, end) {
  const f = d => `${d.getMonth()+1}월 ${d.getDate()}일`;
  return `${f(start)} (월) ~ ${f(end)} (일)`;
}

function reportTable(headers, rows, emptyMsg) {
  if (rows.length === 0) {
    return `<p class="text-muted text-center py-3 mb-0" style="font-size:13px">${emptyMsg}</p>`;
  }
  return `<div class="table-responsive"><table class="table table-sm table-hover mb-0">
    <thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.join('')}</tbody>
  </table></div>`;
}

function sectionCard(num, icon, title, count, bodyHTML, note) {
  return `
    <div class="card mb-3">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="fas ${icon} me-2"></i>${num}. ${title}</span>
        <span class="badge bg-secondary">${count}건</span>
      </div>
      ${note ? `<div class="px-3 pt-2 text-muted" style="font-size:12px">${note}</div>` : ''}
      <div class="card-body p-0">${bodyHTML}</div>
    </div>`;
}

// ── 데이터 로드 ────────────────────────────────────────────────

async function loadReport() {
  const { start, end } = getWeekRange(weekOffset);
  document.getElementById('weekRangeLabel').textContent = fmtRange(start, end) + ' 기준';
  document.getElementById('weekRangeLabelPrint').textContent = fmtRange(start, end);
  document.getElementById('reportAuthorPrint').textContent = displayUserName(currentUserName());
  document.getElementById('reportPrintedAt').textContent = '출력일 ' + formatDate(new Date().toISOString());

  const deals = await getDeals();
  const dealById = {};
  deals.forEach(d => { dealById[d.id] = d; });

  const inRange = dt => dt >= start && dt <= end;

  // 1) 이번 주 신규 접수
  const newIntakes = deals.filter(d => inRange(new Date(d.intake_date || d.created_at)));
  const newIntakeIds = new Set(newIntakes.map(d => d.id));

  // 2) 이번 주 단계 변경 (엑셀이관 이력 제외, 신규접수와 겹치는 '접수' 최초 등록도 제외)
  const history = (await getStageHistorySince(start.toISOString()))
    .filter(h => new Date(h.changed_at) <= end)
    .filter(h => h.changed_by && h.changed_by !== '엑셀이관')
    .filter(h => !(h.stage === '접수' && newIntakeIds.has(h.deal_id)))
    .sort((a, b) => new Date(b.changed_at) - new Date(a.changed_at));

  const decisions = history.filter(h => ['투자확정', '드랍'].includes(h.stage));
  const stageChanges = history.filter(h => !['투자확정', '드랍'].includes(h.stage));

  // 3) 결정 필요 (IC 단계 전체 — 현재 시점 스냅샷)
  const needsDecision = deals.filter(d => d.current_stage === 'IC');

  // 4) 기한 초과 다음 액션 (현재 시점 스냅샷)
  const overdue = deals
    .filter(d => d.next_action && d.next_action_due && isOverdue(d.next_action_due))
    .sort((a, b) => a.next_action_due.localeCompare(b.next_action_due));

  render({ newIntakes, stageChanges, decisions, needsDecision, overdue, dealById });
}

// ── 행 렌더링 ──────────────────────────────────────────────────

function goTo(id) { return `onclick="location.href='deal-detail.html?id=${id}'" style="cursor:pointer"`; }

function intakeRow(d) {
  return `<tr ${goTo(d.id)}>
    <td>${escapeHtml(d.deal_name)}</td>
    <td>${assetBadge(d.asset_class)}</td>
    <td>${escapeHtml(displayUserName(d.assigned_to))}</td>
    <td>${formatDate(d.intake_date || d.created_at)}</td>
  </tr>`;
}

function stageChangeRow(h, dealById) {
  const d = dealById[h.deal_id];
  if (!d) return '';
  return `<tr ${goTo(d.id)}>
    <td>${escapeHtml(d.deal_name)}</td>
    <td>${stageBadge(h.stage)}</td>
    <td>${formatDateTime(h.changed_at)}</td>
    <td>${escapeHtml(displayUserName(h.changed_by || '-'))}</td>
  </tr>`;
}

function decisionRow(h, dealById) {
  const d = dealById[h.deal_id];
  if (!d) return '';
  const reasonNote = h.stage === '드랍' && d.pass_reason
    ? ` <span class="text-muted">(${escapeHtml(d.pass_reason)})</span>` : '';
  return `<tr ${goTo(d.id)}>
    <td>${escapeHtml(d.deal_name)}</td>
    <td>${stageBadge(h.stage)}${reasonNote}</td>
    <td>${formatDateTime(h.changed_at)}</td>
    <td>${escapeHtml(displayUserName(h.changed_by || '-'))}</td>
  </tr>`;
}

function needsDecisionRow(d) {
  return `<tr ${goTo(d.id)}>
    <td>${escapeHtml(d.deal_name)}</td>
    <td>${escapeHtml(displayUserName(d.assigned_to))}</td>
    <td>${formatDate(d.intake_date || d.created_at)}</td>
    <td>${nextActionSummaryHTML(d)}</td>
  </tr>`;
}

function overdueRow(d) {
  return `<tr ${goTo(d.id)}>
    <td>${escapeHtml(d.deal_name)}</td>
    <td>${escapeHtml(d.next_action)}</td>
    <td>${escapeHtml(displayUserName(d.next_action_owner || '미지정'))}</td>
    <td>${nextActionDueHTML(d.next_action_due)}</td>
  </tr>`;
}

// 보고서 맨 앞에 오는 "요약" — 숫자 5개를 한눈에 보여주고, 그 숫자들을 그대로
// 엮은 문장을 붙입니다. 사람이 쓴 것처럼 보이지만 전부 위에서 이미 계산한
// 값이라, 아래 표들과 절대 어긋나지 않습니다(별도로 집계하지 않음).
function summarySection(data) {
  const { newIntakes, stageChanges, decisions, needsDecision, overdue } = data;
  const invested = decisions.filter(h => h.stage === '투자확정').length;
  const dropped = decisions.filter(h => h.stage === '드랍').length;

  const narrative = `이번 주 신규 ${newIntakes.length}건이 접수되었고, ${stageChanges.length}건의 단계 진행이 있었습니다. ` +
    `투자 결정은 ${decisions.length}건(투자확정 ${invested}건 · 드랍 ${dropped}건)이었습니다. ` +
    (needsDecision.length > 0
      ? `현재 투자심의위원회(IC) 단계에서 결정을 기다리는 딜은 ${needsDecision.length}건입니다. `
      : '현재 IC 단계에서 결정을 기다리는 딜은 없습니다. ') +
    (overdue.length > 0
      ? `기한이 지난 다음 액션이 ${overdue.length}건 있어 확인이 필요합니다.`
      : '기한이 지난 다음 액션은 없습니다.');

  const stat = (n, label) => `
    <div class="report-stat">
      <div class="report-stat-num">${n}</div>
      <div class="report-stat-label">${label}</div>
    </div>`;

  return `
    <div class="card mb-3 report-summary-card">
      <div class="card-header"><i class="fas fa-chart-simple me-2"></i>요약</div>
      <div class="card-body">
        <div class="report-stat-row mb-3">
          ${stat(newIntakes.length, '신규 접수')}
          ${stat(stageChanges.length, '단계 변경')}
          ${stat(decisions.length, '투자 결정')}
          ${stat(needsDecision.length, '결정 대기(IC)')}
          ${stat(overdue.length, '기한 초과')}
        </div>
        <p class="mb-0" style="line-height:1.7">${escapeHtml(narrative)}</p>
      </div>
    </div>`;
}

// ── 전체 렌더링 ────────────────────────────────────────────────

function render(data) {
  const { newIntakes, stageChanges, decisions, needsDecision, overdue, dealById } = data;

  const html = [
    summarySection(data),

    sectionCard(1, 'fa-inbox', '이번 주 신규 접수', newIntakes.length,
      reportTable(['딜명', '자산군', '담당자', '인입일'],
        newIntakes.map(intakeRow), '이번 주 신규 접수된 딜이 없습니다.')),

    sectionCard(2, 'fa-right-left', '이번 주 단계 변경', stageChanges.length,
      reportTable(['딜명', '변경된 단계', '변경일시', '변경자'],
        stageChanges.map(h => stageChangeRow(h, dealById)), '이번 주 단계가 바뀐 딜이 없습니다.')),

    sectionCard(3, 'fa-gavel', '이번 주 결정 (투자확정·드랍)', decisions.length,
      reportTable(['딜명', '결정', '결정일시', '결정자'],
        decisions.map(h => decisionRow(h, dealById)), '이번 주 투자확정·드랍으로 결정된 딜이 없습니다.')),

    sectionCard(4, 'fa-triangle-exclamation', '결정 필요 (IC 단계)', needsDecision.length,
      reportTable(['딜명', '담당자', '인입일', '다음 액션'],
        needsDecision.map(needsDecisionRow), '투자심의위원회 단계에 있는 딜이 없습니다.'),
      '이번 주 집계가 아니라 지금 시점에 IC 단계에 있는 딜 전체입니다.'),

    sectionCard(5, 'fa-clock', '기한 초과 다음 액션', overdue.length,
      reportTable(['딜명', '다음 액션', '담당자', '기한'],
        overdue.map(overdueRow), '기한이 지난 다음 액션이 없습니다.'),
      '이번 주 집계가 아니라 지금 시점에 기한이 지난 딜 전체입니다.'),
  ].join('');

  document.getElementById('reportBody').innerHTML = html;
}

function changeWeek(offsetOrDelta) {
  weekOffset = (offsetOrDelta === 0) ? 0 : weekOffset + offsetOrDelta;
  loadReport();
}

renderNav('report');
loadReport();
</script>
</body>
</html>
