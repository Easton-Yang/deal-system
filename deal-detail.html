<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>딜 상세 – 딜 관리 시스템</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="sidebar"></div>

<div id="main">
  <div class="page-header">
    <div style="min-width:0">
      <h1 class="page-title" id="pageTitle" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
        <i class="fas fa-file-alt me-2" style="color:#1a237e"></i>딜 상세
      </h1>
      <p class="page-sub" id="pageSub">불러오는 중...</p>
    </div>
    <div class="d-flex gap-2 flex-shrink-0">
      <button class="btn btn-outline-secondary" onclick="toggleEdit()" id="editToggleBtn">
        <i class="fas fa-edit me-1"></i> 편집
      </button>
      <a href="deals.html" class="btn btn-outline-secondary">
        <i class="fas fa-arrow-left me-1"></i> 목록
      </a>
    </div>
  </div>

  <div class="content-area" id="mainContent">
    <div class="text-center py-5 text-muted">
      <i class="fas fa-spinner fa-spin fa-2x"></i>
      <p class="mt-3">데이터 불러오는 중...</p>
    </div>
  </div>
</div>

<!-- 드랍 사유 모달 -->
<div class="modal fade" id="passReasonModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title"><i class="fas fa-ban text-danger me-2"></i>드랍 사유</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">사유 분류</label>
          <select id="pr_reason" class="form-select">
            <option value="">선택 안 함</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">상세 메모</label>
          <textarea id="pr_note" class="form-control" rows="3" placeholder="드랍 사유를 구체적으로 적어주세요..."></textarea>
        </div>
        <div>
          <label class="form-label">재검토 조건 (선택)</label>
          <textarea id="pr_condition" class="form-control" rows="2" placeholder="예: 가격을 10% 낮추면 재검토"></textarea>
        </div>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
        <button type="button" class="btn btn-danger" onclick="confirmPassReason()">
          <i class="fas fa-ban me-1"></i> 드랍으로 처리
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script>
  // 라이브 모드에서는 실제 딜 데이터가 담긴 seed-data.js를 아예 내려받지
  // 않습니다. 로그인 전 화면에서도 받아가던 파일이라, 대외비 데이터 노출을
  // 막기 위해 데모 모드일 때만 불러옵니다.
  if (DEMO_MODE) document.write('<script src="js/seed-data.js"><\/script>');
</script>
<script src="js/common.js"></script>
<script>
let deal = null;
let editMode = false;
const dealId = getUrlParam('id');

if (!dealId) { window.location.href = 'deals.html'; }

// ── 단계 진행 ──────────────────────────────────────────────────

async function changeStatusUI(newStatus) {
  if (newStatus === dealStatus(deal)) return;
  try {
    deal = await updateDeal(dealId, { review_status: newStatus });
    showToast(`상태가 "${newStatus}"(으)로 변경되었습니다.`, 'success');
    render();
  } catch(e) {
    showToast('상태 변경 실패: ' + e.message, 'danger');
  }
}

async function changeStageUI(newStage) {
  if (newStage === deal.current_stage) return;
  if (newStage === '드랍') { openPassModal(); return; }
  if (!confirm(`단계를 "${newStage}"(으)로 변경하시겠습니까?`)) return;
  try {
    await changeStage(dealId, newStage);
    deal.current_stage = newStage;
    showToast(`단계가 "${newStage}"(으)로 변경되었습니다.`, 'success');
    await load();
  } catch(e) {
    showToast('단계 변경 실패: ' + e.message, 'danger');
  }
}

// ── 드랍 사유 ──────────────────────────────────────────────────
// 딜을 '드랍'으로 바꾸는 순간, 왜 드랍했는지와 재검토 조건을 함께 기록합니다.
// 나중에 같은 딜이 다시 들어왔을 때 과거 판단을 참고할 수 있게 하기 위함입니다.

let passReasonModal = null;

function openPassModal() {
  const sel = document.getElementById('pr_reason');
  if (sel.options.length === 1) {
    PASS_REASONS.forEach(r => {
      const o = document.createElement('option'); o.value = o.textContent = r; sel.appendChild(o);
    });
  }
  document.getElementById('pr_reason').value    = deal.pass_reason || '';
  document.getElementById('pr_note').value      = deal.pass_reason_note || '';
  document.getElementById('pr_condition').value = deal.reconsider_condition || '';
  if (!passReasonModal) passReasonModal = new bootstrap.Modal(document.getElementById('passReasonModal'));
  passReasonModal.show();
}

async function confirmPassReason() {
  const updated = {
    current_stage:        '드랍',
    review_status:         '종결',
    pass_reason:           document.getElementById('pr_reason').value || null,
    pass_reason_note:      document.getElementById('pr_note').value.trim() || null,
    reconsider_condition:  document.getElementById('pr_condition').value.trim() || null,
  };
  try {
    deal = await updateDeal(dealId, updated);
    await tryAddStageHistory(dealId, '드랍', currentUserName());
    passReasonModal.hide();
    showToast('딜이 "드랍"으로 처리되었습니다.', 'success');
    await load();
  } catch(e) {
    showToast('처리 실패: ' + e.message, 'danger');
  }
}

// ── 메모 추가 ──────────────────────────────────────────────────

async function addNote() {
  const ta = document.getElementById('newNoteText');
  const text = ta.value.trim();
  if (!text) { showToast('메모 내용을 입력하세요.', 'warning'); return; }
  try {
    const user = getCurrentUser();
    await createNote(dealId, text, user.username);
    ta.value = '';
    showToast('메모가 저장되었습니다.', 'success');
    await renderNotes();
  } catch(e) {
    showToast('메모 저장 실패: ' + e.message, 'danger');
  }
}

async function deleteNoteUI(noteId) {
  if (!confirm('이 메모를 삭제하시겠습니까?')) return;
  try {
    await deleteNote(noteId);
    showToast('메모가 삭제되었습니다.', 'success');
    await renderNotes();
  } catch(e) {
    showToast('메모 삭제 실패: ' + e.message, 'danger');
  }
}

async function renderNotes() {
  const notes = await getNotes(dealId);
  const container = document.getElementById('notesContainer');
  if (!container) return;
  if (notes.length === 0) {
    container.innerHTML = '<p class="text-muted" style="font-size:13px">아직 메모가 없습니다.</p>';
    return;
  }
  container.innerHTML = `<div class="timeline">` + notes.map(n => `
    <div class="timeline-item">
      <div class="timeline-dot"></div>
      <div class="d-flex justify-content-between align-items-center">
        <span class="timeline-author"><i class="fas fa-user-circle me-1"></i>${escapeHtml(displayUserName(n.author))}</span>
        <span class="timeline-date">${formatDateTime(n.created_at)}</span>
      </div>
      <div class="timeline-body">
        ${escapeHtml(n.note_text).replace(/\n/g,'<br>')}
        <div class="text-end mt-2">
          <button class="btn btn-sm btn-link text-danger p-0" onclick="deleteNoteUI('${n.id}')">
            <i class="fas fa-trash-alt"></i> 삭제
          </button>
        </div>
      </div>
    </div>`).join('') + `</div>`;
}

// ── 단계 이력 ──────────────────────────────────────────────────

async function renderStageHistory() {
  const history = await getStageHistory(dealId);
  const container = document.getElementById('stageHistoryContainer');
  if (!container) return;
  if (history.length === 0) {
    container.innerHTML = '<p class="text-muted" style="font-size:13px">이력이 없습니다.</p>';
    return;
  }
  container.innerHTML = `<div class="timeline">` + history.map(h => `
    <div class="timeline-item">
      <div class="timeline-dot" style="background:#1976d2"></div>
      <div class="d-flex justify-content-between">
        <span>${stageBadge(h.stage)}</span>
        <span class="timeline-date">${formatDateTime(h.changed_at)}${h.changed_by ? ' · ' + escapeHtml(displayUserName(h.changed_by)) : ''}</span>
      </div>
    </div>`).join('') + `</div>`;
}

// ── 파일 ───────────────────────────────────────────────────────

async function handleFileUpload(e) {
  const files = e.target.files;
  if (!files || files.length === 0) return;
  const btn = document.getElementById('uploadBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>업로드 중...';
  try {
    for (const file of files) {
      await uploadFile(dealId, file);
    }
    showToast(`${files.length}개 파일이 업로드되었습니다.`, 'success');
    await renderFiles();
  } catch(e) {
    showToast('파일 업로드 실패: ' + e.message, 'danger');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-upload me-1"></i>파일 추가';
    e.target.value = '';
  }
}

// 첨부파일 내려받기
// 버킷이 비공개라 고정 주소가 없습니다. 누를 때마다 60초만 유효한 서명된 주소를
// 받아서 내려받습니다. 주소에 download 옵션이 들어가 있어 브라우저가 파일로
// 저장하며, 화면은 그대로 머뭅니다(새 창이 열리지 않아 팝업 차단과 무관).
async function downloadFileUI(btn, filePath, fileName) {
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
  try {
    const url = await getFileUrl(filePath, fileName);
    const a = document.createElement('a');
    a.href = url;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
  } catch (e) {
    showToast(e.message, 'danger');
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

async function deleteFileUI(fileId, filePath) {
  if (!confirm('이 파일을 삭제하시겠습니까?')) return;
  try {
    await deleteFile(fileId, filePath);
    showToast('파일이 삭제되었습니다.', 'success');
    await renderFiles();
  } catch(e) {
    showToast('파일 삭제 실패: ' + e.message, 'danger');
  }
}

function fileSize(bytes) {
  if (!bytes) return '';
  if (bytes >= 1048576) return (bytes/1048576).toFixed(1) + ' MB';
  if (bytes >= 1024)    return (bytes/1024).toFixed(0) + ' KB';
  return bytes + ' B';
}

function fileIcon(name) {
  const ext = (name||'').split('.').pop().toLowerCase();
  if (['pdf'].includes(ext)) return 'fa-file-pdf text-danger';
  if (['xls','xlsx'].includes(ext)) return 'fa-file-excel text-success';
  if (['doc','docx'].includes(ext)) return 'fa-file-word text-primary';
  if (['ppt','pptx'].includes(ext)) return 'fa-file-powerpoint text-warning';
  if (['zip','rar'].includes(ext)) return 'fa-file-archive text-secondary';
  return 'fa-file text-secondary';
}

async function renderFiles() {
  const files = await getFiles(dealId);
  const container = document.getElementById('filesContainer');
  if (!container) return;

  // 파일 삭제 버튼 (이벤트 위임) — 한 번만 연결합니다.
  // 예전에는 버튼의 onclick 속성에 파일 경로를 문자열로 끼워 넣었습니다.
  // 경로에는 원본 파일명이 들어 있어서, 파일명에 따옴표가 있으면
  // 속성을 벗어나 임의 코드가 실행될 수 있었습니다.
  if (!container.dataset.delegated) {
    container.addEventListener('click', function (e) {
      const dl = e.target.closest('.js-download-file');
      if (dl) {
        e.preventDefault();
        downloadFileUI(dl, dl.dataset.path, dl.dataset.name);
        return;
      }
      const btn = e.target.closest('.js-delete-file');
      if (!btn) return;
      e.preventDefault();
      deleteFileUI(btn.dataset.id, btn.dataset.path);
    });
    container.dataset.delegated = '1';
  }

  if (files.length === 0) {
    container.innerHTML = '<p class="text-muted" style="font-size:13px">첨부된 파일이 없습니다.</p>';
    return;
  }
  container.innerHTML = files.map(f => `
    <div class="file-item">
      <i class="fas ${fileIcon(f.file_name)} file-icon fa-lg"></i>
      <div class="flex-grow-1 min-width-0">
        <div class="file-name">${escapeHtml(f.file_name)}</div>
        <div class="file-meta">${fileSize(f.file_size)}${f.uploaded_by ? ' · ' + escapeHtml(displayUserName(f.uploaded_by)) : ''} · ${formatDateTime(f.uploaded_at)}</div>
      </div>
      ${f.file_path ? `
      <button type="button" class="btn btn-sm btn-outline-primary me-1 js-download-file"
        data-path="${escapeHtml(f.file_path)}" data-name="${escapeHtml(f.file_name)}"
        title="내려받기">
        <i class="fas fa-download"></i>
      </button>` : `
      <button type="button" class="btn btn-sm btn-outline-secondary me-1" disabled
        title="데모 모드에서는 파일이 실제로 저장되지 않아 내려받을 수 없습니다">
        <i class="fas fa-download"></i>
      </button>`}
      <button type="button" class="btn btn-sm btn-outline-danger js-delete-file"
        data-id="${escapeHtml(f.id)}" data-path="${escapeHtml(f.file_path||'')}">
        <i class="fas fa-trash"></i>
      </button>
    </div>`).join('');
}

// ── 다음 액션·기한 ─────────────────────────────────────────────

async function saveNextAction() {
  const updated = {
    next_action:       document.getElementById('na_action').value.trim() || null,
    next_action_owner: document.getElementById('na_owner').value || null,
    next_action_due:   document.getElementById('na_due').value || null,
    next_action_note:  document.getElementById('na_note').value.trim() || null,
  };
  try {
    deal = await updateDeal(dealId, updated);
    showToast('다음 액션이 저장되었습니다.', 'success');
    render();
  } catch(e) {
    showToast('저장 실패: ' + e.message, 'danger');
  }
}

function nextActionSectionHTML() {
  const ownerOptions = ['', ...TEAM_MEMBERS].map(m =>
    `<option value="${escapeHtml(m)}" ${(deal.next_action_owner||'')===m ? 'selected':''}>${m ? escapeHtml(displayUserName(m)) : '미지정'}</option>`
  ).join('');

  return `
    <div class="detail-section mb-3">
      <div class="detail-section-header"><i class="fas fa-tasks" style="color:#1a237e"></i> 다음 액션·기한</div>
      <div class="detail-section-body">
        <div class="row g-2">
          <div class="col-md-5">
            <label class="form-label" style="font-size:12px">다음에 할 일</label>
            <input type="text" id="na_action" class="form-control form-control-sm"
              placeholder="예: 수정 조건표 수령 대기" value="${escapeHtml(deal.next_action||'')}">
          </div>
          <div class="col-md-3">
            <label class="form-label" style="font-size:12px">담당자</label>
            <select id="na_owner" class="form-select form-select-sm">${ownerOptions}</select>
          </div>
          <div class="col-md-2">
            <label class="form-label" style="font-size:12px">기한</label>
            <input type="date" id="na_due" class="form-control form-control-sm" value="${escapeHtml(deal.next_action_due||'')}">
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <button class="btn btn-sm btn-primary w-100" onclick="saveNextAction()">
              <i class="fas fa-save me-1"></i>저장
            </button>
          </div>
          <div class="col-12">
            <label class="form-label" style="font-size:12px">대기 사유 / 메모</label>
            <input type="text" id="na_note" class="form-control form-control-sm"
              placeholder="예: 상대측 회신 대기" value="${escapeHtml(deal.next_action_note||'')}">
          </div>
        </div>
        ${deal.next_action_due ? `<div class="mt-2" style="font-size:12px">현재 기한: ${nextActionDueHTML(deal.next_action_due)}</div>` : ''}
      </div>
    </div>`;
}

// ── 투자조건 (1차검토 단계부터 노출) ──────────────────────────

// 통화를 바꾸면 입력 단위(억/백만/천만)가 달라지므로, 숫자를 잘못된 단위로
// 그대로 두면 엉뚱한 금액이 저장됩니다. 라벨을 새 단위로 바꾸고 입력칸은
// 비워서 다시 입력하게 합니다.
function onInvestmentCurrencyChange() {
  const currency = document.getElementById('it_currency').value || 'KRW';
  const unit = currencyUnit(currency);
  document.getElementById('it_amount_unit').textContent = unit.label || '그대로';
  document.getElementById('it_amount').value = '';
}

async function saveInvestmentTerms() {
  const currency = document.getElementById('it_currency').value || 'KRW';
  const unit = currencyUnit(currency);
  const updated = {
    investment_vehicle: document.getElementById('it_vehicle').value || null,
    currency:           document.getElementById('it_currency').value || null,
    review_amount:      Math.round(Number(document.getElementById('it_amount').value) * unit.factor) || null,
    maturity_term:      document.getElementById('it_maturity').value.trim() || null,
    expected_return:    document.getElementById('it_return').value.trim() || null,
    investment_thesis:  document.getElementById('it_thesis').value.trim() || null,
    key_risks:          document.getElementById('it_risks').value.trim() || null,
  };
  try {
    deal = await updateDeal(dealId, updated);
    showToast('투자조건이 저장되었습니다.', 'success');
    render();
  } catch(e) {
    showToast('저장 실패: ' + e.message, 'danger');
  }
}

function investmentTermsSectionHTML() {
  const vehicleOptions = ['', ...INVESTMENT_VEHICLES].map(v =>
    `<option value="${v}" ${(deal.investment_vehicle||'')===v ? 'selected':''}>${v || '미지정'}</option>`
  ).join('');
  const curOptions = ['', ...CURRENCIES].map(c =>
    `<option value="${c}" ${(deal.currency||'')===c ? 'selected':''}>${c || '미지정'}</option>`
  ).join('');
  const itUnit = currencyUnit(deal.currency || 'KRW');

  return `
    <div class="detail-section mb-3">
      <div class="detail-section-header"><i class="fas fa-file-contract" style="color:#1a237e"></i> 투자조건</div>
      <div class="detail-section-body">
        <div class="row g-2">
          <div class="col-md-2">
            <label class="form-label" style="font-size:12px">투자수단</label>
            <select id="it_vehicle" class="form-select form-select-sm">${vehicleOptions}</select>
          </div>
          <div class="col-md-2">
            <label class="form-label" style="font-size:12px">통화</label>
            <select id="it_currency" class="form-select form-select-sm" onchange="onInvestmentCurrencyChange()">${curOptions}</select>
          </div>
          <div class="col-md-3">
            <label class="form-label" style="font-size:12px">당사 검토금액 (<span id="it_amount_unit">${itUnit.label || '그대로'}</span>)</label>
            <input type="number" id="it_amount" class="form-control form-control-sm" step="0.01" value="${escapeHtml(deal.review_amount ? deal.review_amount/itUnit.factor : '')}">
          </div>
          <div class="col-md-2">
            <label class="form-label" style="font-size:12px">만기</label>
            <input type="text" id="it_maturity" class="form-control form-control-sm"
              placeholder="예: 3년" value="${escapeHtml(deal.maturity_term||'')}">
          </div>
          <div class="col-md-3">
            <label class="form-label" style="font-size:12px">기대수익률</label>
            <input type="text" id="it_return" class="form-control form-control-sm"
              placeholder="예: 연 8%" value="${escapeHtml(deal.expected_return||'')}">
          </div>
          <div class="col-12">
            <label class="form-label" style="font-size:12px">핵심 투자논거</label>
            <textarea id="it_thesis" class="form-control form-control-sm" rows="2">${escapeHtml(deal.investment_thesis||'')}</textarea>
          </div>
          <div class="col-12">
            <label class="form-label" style="font-size:12px">주요 위험</label>
            <textarea id="it_risks" class="form-control form-control-sm" rows="2">${escapeHtml(deal.key_risks||'')}</textarea>
          </div>
        </div>
        <div class="d-flex justify-content-end mt-2">
          <button class="btn btn-sm btn-primary" onclick="saveInvestmentTerms()">

}

// ── 편집 모드 ──────────────────────────────────────────────────

function toggleEdit() {
  editMode = !editMode;
  const btn = document.getElementById('editToggleBtn');
  if (editMode) {
    btn.className = 'btn btn-warning';
    btn.innerHTML = '<i class="fas fa-times me-1"></i> 편집 취소';
    renderEditForm();
  } else {
    btn.className = 'btn btn-outline-secondary';
    btn.innerHTML = '<i class="fas fa-edit me-1"></i> 편집';
    render();
  }
}

function renderEditForm() {
  const editSection = document.getElementById('editSection');
  if (!editSection) return;

  const assetOptions = ASSET_CLASSES.map(a => `<option value="${escapeHtml(a)}" ${deal.asset_class===a?'selected':''}>${escapeHtml(a)}</option>`).join('');
  const channelOptions = INTAKE_CHANNELS.map(c => `<option value="${escapeHtml(c)}" ${deal.intake_channel===c?'selected':''}>${escapeHtml(c)}</option>`).join('');
  const assigneeOptions = [...TEAM_MEMBERS, UNASSIGNED].map(m => `<option value="${escapeHtml(m)}" ${deal.assigned_to===m?'selected':''}>${escapeHtml(displayUserName(m))}</option>`).join('');
  const resultOptions = ['','투자','드랍','보류'].map(r => `<option value="${r}" ${(deal.final_result||'')===r?'selected':''}>${r||'미정'}</option>`).join('');
  const passReasonOptions = ['', ...PASS_REASONS].map(r => `<option value="${r}" ${(deal.pass_reason||'')===r?'selected':''}>${r||'선택 안 함'}</option>`).join('');

  editSection.innerHTML = `
    <div class="detail-section mb-3">
      <div class="detail-section-header"><i class="fas fa-pencil-alt" style="color:#f57c00"></i> 정보 편집</div>
      <div class="detail-section-body">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label">딜명 <span class="required-star">*</span></label>
            <input type="text" id="e_name" class="form-control" value="${escapeHtml(deal.deal_name)}">
          </div>
          <div class="col-md-4">
            <label class="form-label">자산군</label>
            <select id="e_asset" class="form-select">${assetOptions}</select>
          </div>
          <div class="col-md-4">
            <label class="form-label">인입경로</label>
            <select id="e_channel" class="form-select">${channelOptions}</select>
          </div>
          <div class="col-md-4">
            <label class="form-label">인입일자</label>
            <input type="date" id="e_date" class="form-control" value="${escapeHtml(deal.intake_date||'')}">
          </div>
          <div class="col-md-4">
            <label class="form-label">담당자</label>
            <select id="e_assignee" class="form-select">${assigneeOptions}</select>
          </div>
          <div class="col-md-4">
            <label class="form-label">딜 규모 (억원)</label>
            <input type="number" id="e_size" class="form-control" step="0.1" value="${escapeHtml(deal.deal_size ? deal.deal_size/1e8 : '')}">
          </div>
          <div class="col-md-4">
            <label class="form-label">소개자/GP명</label>
            <input type="text" id="e_gp" class="form-control" value="${escapeHtml(deal.introducer_gp||'')}">
          </div>
          <div class="col-md-6">
            <label class="form-label">1차 의견</label>
            <textarea id="e_opinion" class="form-control" rows="3">${escapeHtml(deal.first_opinion||'')}</textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label">최종 결과</label>
            <select id="e_result" class="form-select">${resultOptions}</select>
          </div>
          <div class="col-md-4">
            <label class="form-label">드랍 사유 분류</label>
            <select id="e_pass_reason" class="form-select">${passReasonOptions}</select>
          </div>
          <div class="col-md-8">
            <label class="form-label">드랍 사유 상세 메모</label>
            <input type="text" id="e_pass_note" class="form-control" value="${escapeHtml(deal.pass_reason_note||'')}">
          </div>
          <div class="col-12">
            <label class="form-label">재검토 조건</label>
            <input type="text" id="e_reconsider" class="form-control" placeholder="예: 가격을 10% 낮추면 재검토" value="${escapeHtml(deal.reconsider_condition||'')}">
          </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-3">
          <button class="btn btn-secondary" onclick="toggleEdit()">취소</button>
          <button class="btn btn-primary" onclick="saveEdit()">
            <i class="fas fa-save me-1"></i> 저장
          </button>
        </div>
      </div>
    </div>`;
}

async function saveEdit() {
  const name = document.getElementById('e_name').value.trim();
  if (!name) { showToast('딜명을 입력하세요.', 'warning'); return; }

  const updated = {
    deal_name:      name,
    asset_class:    document.getElementById('e_asset').value,
    intake_channel: document.getElementById('e_channel').value,
    intake_date:    document.getElementById('e_date').value,
    assigned_to:    document.getElementById('e_assignee').value,
    deal_size:      Math.round(Number(document.getElementById('e_size').value) * 1e8) || null,
    introducer_gp:  document.getElementById('e_gp').value.trim() || null,
    first_opinion:  document.getElementById('e_opinion').value.trim() || null,
    final_result:   document.getElementById('e_result').value || null,
    pass_reason:          document.getElementById('e_pass_reason').value || null,
    pass_reason_note:     document.getElementById('e_pass_note').value.trim() || null,
    reconsider_condition: document.getElementById('e_reconsider').value.trim() || null,
  };

  try {
    deal = await updateDeal(dealId, updated);
    editMode = false;
    document.getElementById('editToggleBtn').className = 'btn btn-outline-secondary';
    document.getElementById('editToggleBtn').innerHTML = '<i class="fas fa-edit me-1"></i> 편집';
    showToast('저장되었습니다.', 'success');
    await load();
  } catch(e) {
    showToast('저장 실패: ' + e.message, 'danger');
  }
}

// ── 렌더링 ─────────────────────────────────────────────────────

function stageProgressHTML(current) {
  return `<div class="stage-progress">` + STAGES.map(s => {
    const idx = STAGES.indexOf(s);
    const curIdx = STAGES.indexOf(current);
    let cls = '';
    if (s === current && s === '드랍') cls = 'pass-active';
    else if (s === current) cls = 'active';
    else if (idx < curIdx && current !== '드랍') cls = 'done';
    return `<div class="stage-step ${cls}" onclick="changeStageUI('${s}')" title="${s}으로 변경">${s}</div>`;
  }).join('') + `</div>`;
}

function render() {
  if (!deal) return;

  // 접수 단계에서는 투자조건 섹션을 숨기고 1차검토부터 노출합니다.
  const showInvestmentTerms = STAGES.indexOf(deal.current_stage) >= STAGES.indexOf('1차검토');

  document.getElementById('pageTitle').innerHTML =
    `<i class="fas fa-file-alt me-2" style="color:#1a237e"></i>${escapeHtml(deal.deal_name)}`;
  document.getElementById('pageSub').innerHTML =
    `${assetBadge(deal.asset_class)} &nbsp;${stageBadge(deal.current_stage)} &nbsp;${statusBadge(dealStatus(deal))}
     ${deal.final_result ? '&nbsp;' + resultBadge(deal.final_result) : ''}
     &nbsp;<span class="text-muted" style="font-size:12px">등록: ${formatDateTime(deal.created_at)}</span>`;

  document.getElementById('mainContent').innerHTML = `
    <!-- 단계 진행 -->
    <div class="detail-section mb-3">
      <div class="detail-section-header d-flex justify-content-between align-items-center">
        <div>
          <i class="fas fa-route" style="color:#1a237e"></i> 검토 단계
          <span class="text-muted" style="font-size:12px;font-weight:400;margin-left:8px">클릭하여 단계 변경</span>

            ${REVIEW_STATUSES.map(s => `<option value="${s}" ${dealStatus(deal)===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="detail-section-body">${stageProgressHTML(deal.current_stage)}</div>
    </div>

    <!-- 다음 액션·기한 -->
    ${nextActionSectionHTML()}

    <!-- 투자조건: 접수 단계에서는 숨기고 1차검토부터 노출 -->
    ${showInvestmentTerms ? investmentTermsSectionHTML() : ''}

    <div class="row g-3">
      <!-- 왼쪽 -->
      <div class="col-lg-8">

        <!-- 편집 영역 -->
        <div id="editSection"></div>

        <!-- 기본 정보 -->
        <div class="detail-section mb-3" id="infoSection">
          <div class="detail-section-header"><i class="fas fa-info-circle" style="color:#1a237e"></i> 기본 정보</div>
          <div class="detail-section-body">
            <div class="row">
              <div class="col-md-6">
                <div class="info-row"><div class="info-label">자산군</div><div class="info-value">${assetBadge(deal.asset_class)}</div></div>
                <div class="info-row"><div class="info-label">인입경로</div><div class="info-value">${escapeHtml(deal.intake_channel)}</div></div>
                <div class="info-row"><div class="info-label">인입일자</div><div class="info-value">${formatDate(deal.intake_date)}</div></div>
                <div class="info-row"><div class="info-label">담당자</div><div class="info-value"><strong>${escapeHtml(displayUserName(deal.assigned_to))}</strong></div></div>
              </div>
              <div class="col-md-6">
                <div class="info-row"><div class="info-label">딜 규모</div><div class="info-value"><strong>${formatCurrency(deal.deal_size)}</strong></div></div>
                <div class="info-row"><div class="info-label">당사 검토금액</div><div class="info-value">${formatReviewAmount(deal)}</div></div>
                <div class="info-row"><div class="info-label">소개자/GP</div><div class="info-value">${escapeHtml(deal.introducer_gp || '-')}</div></div>
                <div class="info-row"><div class="info-label">최종결과</div><div class="info-value">${resultBadge(deal.final_result) || '<span class="text-muted">미정</span>'}</div></div>
                <div class="info-row"><div class="info-label">최종수정</div><div class="info-value text-muted">${formatDateTime(deal.updated_at)}</div></div>
              </div>
            </div>
            ${deal.first_opinion ? `
            <hr>
            <div class="info-row">
              <div class="info-label">1차 의견</div>
              <div class="info-value">${escapeHtml(deal.first_opinion).replace(/\n/g,'<br>')}</div>
            </div>` : ''}
            ${(deal.pass_reason || deal.pass_reason_note || deal.reconsider_condition) ? `
            <hr>
            <div class="info-row">
              <div class="info-label">드랍 사유</div>
              <div class="info-value">
                ${deal.pass_reason ? `<span class="badge bg-danger-subtle text-danger-emphasis border me-1">${escapeHtml(deal.pass_reason)}</span>` : ''}
                ${deal.pass_reason_note ? escapeHtml(deal.pass_reason_note).replace(/\n/g,'<br>') : ''}
              </div>
            </div>
            ${deal.reconsider_condition ? `
            <div class="info-row">
              <div class="info-label">재검토 조건</div>
              <div class="info-value">${escapeHtml(deal.reconsider_condition).replace(/\n/g,'<br>')}</div>
            </div>` : ''}` : ''}
          </div>
        </div>

        <!-- 검토 메모 -->
        <div class="detail-section mb-3">
          <div class="detail-section-header"><i class="fas fa-comments" style="color:#1a237e"></i> 검토 메모</div>
          <div class="detail-section-body">
            <div class="mb-3">
              <textarea id="newNoteText" class="form-control" rows="3"
                placeholder="검토 의견, 회의 결과, 특이사항 등을 기록하세요..."></textarea>
              <div class="d-flex justify-content-between align-items-center mt-2">
                <span class="text-muted" style="font-size:12px">작성자: <strong>${escapeHtml(displayUserName(currentUserName()))}</strong></span>
                <button class="btn btn-primary btn-sm" onclick="addNote()">
                  <i class="fas fa-plus me-1"></i>메모 추가
                </button>

            </div>
            <hr>

          </div>

        <!-- 파일 첨부 -->
        <div class="detail-section">

          <div class="detail-section-body">

      </div>

      <div class="col-lg-4">

        <!-- 단계 이력 -->

          <div class="detail-section-header"><i class="fas fa-history" style="color:#1a237e"></i> 단계 이력</div>
          <div class="detail-section-body">
            <div id="stageHistoryContainer"><p class="text-muted">로딩 중...</p></div>
          </div>
        </div>

        <!-- 빠른 메모 -->
        <div class="card border-0 mb-3" style="background:#fff3e0">
          <div class="card-body">
            <h6 class="fw-bold" style="color:#e65100"><i class="fas fa-exclamation-circle me-2"></i>단계 변경 안내</h6>
            <p style="font-size:12px;color:#6c757d;margin:0">위 단계 바에서 원하는 단계를 클릭하면 즉시 변경됩니다. 변경 이력은 자동으로 기록됩니다.</p>
          </div>
        </div>

      </div>
    </div>`;

  // 편집 모드였으면 폼 다시 렌더링
  if (editMode) renderEditForm();

  // 비동기 콘텐츠 로드
  renderNotes();
  renderStageHistory();
  renderFiles();
}

// ── 메인 로드 ──────────────────────────────────────────────────

async function load() {
  try {
    deal = await getDeal(dealId);
    if (!deal) {
      document.getElementById('mainContent').innerHTML =
        `<div class="empty-state"><i class="fas fa-exclamation-circle d-block text-danger"></i><p>딜을 찾을 수 없습니다.</p><a href="deals.html" class="btn btn-primary mt-3">목록으로</a></div>`;
      return;
    }
    render();
  } catch(e) {
    document.getElementById('mainContent').innerHTML =
      `<div class="alert alert-danger">데이터 로드 실패: ${e.message}</div>`;
  }
}

renderNav('deals');
load();
</script>
