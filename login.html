<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>딜 관리 시스템 - 로그인</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    .login-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 420px;
      padding: 40px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-header i {
      font-size: 48px;
      color: #667eea;
      margin-bottom: 10px;
    }
    .login-header h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 10px 0 5px;
      color: #333;
    }
    .login-header p {
      color: #999;
      font-size: 14px;
    }
    .form-control {
      border-radius: 8px;
      border: 1px solid #ddd;
      padding: 12px 15px;
      font-size: 14px;
    }
    .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .btn-login {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-weight: 600;
      width: 100%;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
      color: white;
    }
    .alert {
      border-radius: 8px;
      border: none;
      font-size: 14px;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .nav-tabs {
      border: none;
      margin-bottom: 20px;
    }
    .nav-tabs .nav-link {
      color: #999;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 10px 0;
      font-weight: 600;
    }
    .nav-tabs .nav-link.active {
      color: #667eea;
      border-color: #667eea;
    }
    .user-list {
      max-height: 300px;
      overflow-y: auto;
    }
    .user-item {
      padding: 12px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .user-item:last-child {
      border-bottom: none;
    }
    .user-info {
      flex: 1;
    }
    .user-info strong {
      display: block;
      color: #333;
    }
    .user-info small {
      color: #999;
    }
    .btn-sm {
      padding: 4px 8px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <!-- 로그인/관리 탭 -->
    <ul class="nav nav-tabs" role="tablist">
      <li class="nav-item">
        <a class="nav-link active" href="#login-tab" data-tab="login-tab" role="tab">로그인</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#admin-tab" data-tab="admin-tab" role="tab">관리</a>
      </li>
    </ul>

    <!-- 로그인 탭 -->
    <div id="login-tab" class="tab-content active">
      <div class="login-header">
        <i class="fas fa-briefcase"></i>
        <h1>딜 관리 시스템</h1>
        <p>로그인 후 계속하세요</p>
      </div>

      <div id="login-error" class="alert alert-danger d-none" role="alert"></div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label for="username" class="form-label">사용자명</label>
          <input type="text" class="form-control" id="username" required autofocus>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">비밀번호</label>
          <input type="password" class="form-control" id="password" required>
        </div>
        <button type="submit" class="btn btn-login text-white">로그인</button>
      </form>
    </div>

    <!-- 관리 탭 -->
    <div id="admin-tab" class="tab-content">
      <!-- 관리자 비밀번호 입력 -->
      <div id="admin-login-section">
        <h5 class="mb-3">관리자 전용</h5>
        <p class="text-muted mb-3">관리자 비밀번호를 입력하세요</p>
        <div id="admin-login-error" class="alert alert-danger d-none" role="alert"></div>
        <div class="mb-3">
          <input type="password" class="form-control" id="admin-password" placeholder="관리자 비밀번호" autofocus>
        </div>
        <button type="button" class="btn btn-primary w-100" onclick="checkAdminPassword()">확인</button>
      </div>

      <!-- 관리자 패널 (비밀번호 확인 후 표시) -->
      <div id="admin-panel-section" class="d-none">
        <div id="migration-status"></div>

        <h5 class="mb-3">데이터 마이그레이션</h5>
        <p class="text-muted mb-3" style="font-size:13px">기존 데이터(247건)를 Supabase로 업로드합니다</p>
        <button type="button" class="btn btn-success w-100 mb-3" onclick="manualMigrateDataToSupabase()">
          <i class="fas fa-upload me-2"></i>데이터 업로드 시작
        </button>

        <hr class="my-3">

        <h5 class="mb-3">사용자 비밀번호 관리</h5>
        <div id="admin-error" class="alert alert-danger d-none" role="alert"></div>
        <div id="admin-success" class="alert alert-success d-none" role="alert"></div>

        <div class="user-list" id="user-list">
          <p class="text-muted text-center py-3">사용자 목록 로딩 중...</p>
        </div>

        <button type="button" class="btn btn-outline-secondary mt-3 w-100" onclick="logoutAdmin()">로그아웃</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>

  <script>
    // 탭 전환
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        const tabId = this.getAttribute('data-tab');

        // 모든 탭 비활성화
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));

        // 선택된 탭 활성화
        this.classList.add('active');
        document.getElementById(tabId).classList.add('active');

        if (tabId === 'admin-tab') {
          resetAdminTab();
        }
      });
    });

    // 로그인 처리
    async function handleLogin(event) {
      event.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('login-error');

      errorDiv.classList.add('d-none');

      if (DEMO_MODE) {
        // 데모 모드: 임의로 로그인 허용
        const user = { username: username, full_name: username, role: 'user' };
        localStorage.setItem('current_user', JSON.stringify(user));
        window.location.href = 'index.html';
        return;
      }

      if (!SUPABASE_URL || SUPABASE_URL.includes('YOUR_PROJECT')) {
        errorDiv.textContent = 'Supabase가 설정되지 않았습니다';
        errorDiv.classList.remove('d-none');
        return;
      }

      try {
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data, error } = await supabase
          .from('users')
          .select('*')
          .eq('username', username)
          .single();

        if (error || !data) {
          errorDiv.textContent = '사용자를 찾을 수 없습니다';
          errorDiv.classList.remove('d-none');
          return;
        }

        // 임시: 간단한 비밀번호 확인 (추후 bcrypt 필요)
        if (data.password_hash && data.password_hash !== password && data.password_hash !== '') {
          errorDiv.textContent = '비밀번호가 맞지 않습니다';
          errorDiv.classList.remove('d-none');
          return;
        }

        const user = { id: data.id, username: data.username, full_name: data.full_name, role: data.role };
        localStorage.setItem('current_user', JSON.stringify(user));
        window.location.href = 'index.html';
      } catch (err) {
        errorDiv.textContent = '로그인 중 오류: ' + err.message;
        errorDiv.classList.remove('d-none');
      }
    }

    // 사용자 목록 로드
    async function loadUsers() {
      const listDiv = document.getElementById('user-list');
      const errorDiv = document.getElementById('admin-error');

      if (DEMO_MODE) {
        listDiv.innerHTML = '<p class="text-muted text-center py-3">데모 모드에서는 사용자 관리가 지원되지 않습니다</p>';
        return;
      }

      if (!SUPABASE_URL || SUPABASE_URL.includes('YOUR_PROJECT')) {
        listDiv.innerHTML = '<p class="text-muted text-center py-3">Supabase가 설정되지 않았습니다</p>';
        return;
      }

      try {
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data, error } = await supabase.from('users').select('*');

        if (error) throw error;

        if (!data || data.length === 0) {
          listDiv.innerHTML = '<p class="text-muted text-center py-3">사용자가 없습니다</p>';
          return;
        }

        listDiv.innerHTML = data.map(user => `
          <div class="user-item">
            <div class="user-info">
              <strong>${user.full_name || user.username}</strong>
              <small>${user.username}</small>
            </div>
            <button type="button" class="btn btn-sm btn-primary" onclick="showPasswordModal(${user.id}, '${user.username}')">
              비밀번호 변경
            </button>
          </div>
        `).join('');
      } catch (err) {
        errorDiv.textContent = '사용자 목록 로드 실패: ' + err.message;
        errorDiv.classList.remove('d-none');
      }
    }

    // 비밀번호 변경 (모달에서 구현)
    function showPasswordModal(userId, username) {
      const newPassword = prompt(`${username}의 새 비밀번호를 입력하세요:`, '');
      if (!newPassword) return;

      updatePassword(userId, newPassword);
    }

    async function updatePassword(userId, newPassword) {
      const errorDiv = document.getElementById('admin-error');
      const successDiv = document.getElementById('admin-success');

      errorDiv.classList.add('d-none');
      successDiv.classList.add('d-none');

      try {
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { error } = await supabase
          .from('users')
          .update({ password_hash: newPassword })
          .eq('id', userId);

        if (error) throw error;

        successDiv.textContent = '비밀번호가 변경되었습니다';
        successDiv.classList.remove('d-none');
        loadUsers();
      } catch (err) {
        errorDiv.textContent = '비밀번호 변경 실패: ' + err.message;
        errorDiv.classList.remove('d-none');
      }
    }

    // ── 관리자 탭 보호 ────────────────────────────────────────────────
    // 관리자 탭이 초기화될 때
    function resetAdminTab() {
      const loginSection = document.getElementById('admin-login-section');
      const panelSection = document.getElementById('admin-panel-section');
      const passwordInput = document.getElementById('admin-password');
      const errorDiv = document.getElementById('admin-login-error');

      // 관리자 비밀번호 입력 상태로 초기화
      loginSection.classList.remove('d-none');
      panelSection.classList.add('d-none');
      errorDiv.classList.add('d-none');
      passwordInput.value = '';
      passwordInput.focus();
    }

    // 관리자 비밀번호 확인
    function checkAdminPassword() {
      const passwordInput = document.getElementById('admin-password');
      const password = passwordInput.value;
      const errorDiv = document.getElementById('admin-login-error');

      if (!password) {
        errorDiv.textContent = '비밀번호를 입력하세요';
        errorDiv.classList.remove('d-none');
        return;
      }

      if (password === ADMIN_PASSWORD) {
        // 비밀번호 맞음
        document.getElementById('admin-login-section').classList.add('d-none');
        document.getElementById('admin-panel-section').classList.remove('d-none');
        loadUsers();
      } else {
        // 비밀번호 틀림
        errorDiv.textContent = '관리자 비밀번호가 맞지 않습니다';
        errorDiv.classList.remove('d-none');
        passwordInput.value = '';
      }
    }

    // 관리자 로그아웃
    function logoutAdmin() {
      resetAdminTab();
    }

    // Enter 키 입력 시 비밀번호 확인
    document.addEventListener('DOMContentLoaded', function() {
      const adminPasswordInput = document.getElementById('admin-password');
      if (adminPasswordInput) {
        adminPasswordInput.addEventListener('keypress', function(e) {
          if (e.key === 'Enter') {
            checkAdminPassword();
          }
        });
      }
    });
  </script>
</body>
</html>
