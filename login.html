<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>딜 관리 시스템 - 로그인</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    .login-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 420px;
      padding: 40px;
    }
    .login-header { text-align: center; margin-bottom: 30px; }
    .login-header i { font-size: 48px; color: #667eea; margin-bottom: 10px; }
    .login-header h1 { font-size: 28px; font-weight: 700; margin: 10px 0 5px; color: #333; }
    .login-header p { color: #999; font-size: 14px; }
    .form-control { border-radius: 8px; border: 1px solid #ddd; padding: 12px 15px; font-size: 14px; }
    .form-control:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
    .btn-login {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none; border-radius: 8px; padding: 12px; font-weight: 600; width: 100%;
    }
    .btn-login:hover { background: linear-gradient(135deg, #764ba2 0%, #667eea 100%); color: white; }
    .btn-login:disabled { opacity: .65; }
    .alert { border-radius: 8px; border: none; font-size: 14px; }
    .login-foot { margin-top: 22px; font-size: 12px; color: #aaa; text-align: center; line-height: 1.7; }
    .login-foot a { color: #667eea; text-decoration: none; }
    .input-group-text { background: #f6f7fb; border: 1px solid #ddd; border-left: none; border-radius: 0 8px 8px 0; font-size: 13px; color: #888; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <i class="fas fa-briefcase"></i>
      <h1>딜 관리 시스템</h1>
      <p>회사 계정으로 로그인하세요</p>
    </div>

    <div id="login-error" class="alert alert-danger d-none" role="alert"></div>
    <div id="login-notice" class="alert alert-warning d-none" role="alert"></div>

    <form id="login-form">
      <div class="mb-3">
        <label for="loginId" class="form-label">아이디</label>
        <div class="input-group">
          <input type="text" class="form-control" id="loginId" autocomplete="username"
                 inputmode="email" required autofocus>
          <span class="input-group-text d-none" id="domainHint"></span>
        </div>
      </div>
      <div class="mb-3">
        <label for="loginPassword" class="form-label">비밀번호</label>
        <input type="password" class="form-control" id="loginPassword"
               autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-login text-white" id="loginBtn">로그인</button>
    </form>

    <div class="login-foot">
      비밀번호를 잊으셨거나 계정이 없으면 자산운용팀 관리자에게 문의하세요.<br>
      데이터 관리는 <a href="admin.html">관리 페이지</a>에서 (로그인 필요)
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/seed-data.js"></script>
  <script src="js/common.js"></script>

  <script>
    // ================================================================
    // 로그인 화면
    // 비밀번호 확인은 Supabase Auth(서버)가 합니다. 이 파일은 비밀번호를
    // 저장하지도, 비교하지도, 다른 사람 것을 바꾸지도 않습니다.
    // ================================================================
    const errorDiv  = document.getElementById('login-error');
    const noticeDiv = document.getElementById('login-notice');
    const loginBtn  = document.getElementById('loginBtn');

    function showError(msg) {
      errorDiv.textContent = msg;
      errorDiv.classList.remove('d-none');
    }
    function clearError() {
      errorDiv.classList.add('d-none');
    }
    function showNotice(msg) {
      noticeDiv.innerHTML = msg;
      noticeDiv.classList.remove('d-none');
    }

    // 설정 점검 + 도메인 안내
    (function initLoginForm() {
      if (DEMO_MODE) {
        showNotice('<strong>데모 모드</strong>입니다. 아무 값이나 넣어도 들어갈 수 있고, ' +
                   '데이터는 이 브라우저에만 저장됩니다.');
        return;
      }
      if (!SUPABASE_URL || SUPABASE_URL.includes('YOUR_PROJECT')) {
        showNotice('Supabase 주소가 설정되지 않았습니다. <code>js/config.js</code> 를 확인하세요.');
        loginBtn.disabled = true;
        return;
      }
      if (LOGIN_EMAIL_DOMAIN) {
        const hint = document.getElementById('domainHint');
        hint.textContent = '@' + LOGIN_EMAIL_DOMAIN;
        hint.classList.remove('d-none');
        document.getElementById('loginId').placeholder = 'dongmin.yang';
      } else {
        document.getElementById('loginId').placeholder = '회사 메일 주소 전체';
      }
    })();

    // 이미 로그인한 상태로 이 페이지에 오면 바로 대시보드로 보냅니다.
    (async function redirectIfLoggedIn() {
      if (DEMO_MODE) return;

      // 다른 페이지가 '로그인 안 됨'으로 판단해 여기로 보냈는데,
      // 여기서는 '로그인 됨'으로 보이는 경우 → 두 판단이 엇갈린 상태입니다.
      // 그냥 돌려보내면 두 화면을 무한히 왕복하므로, 남은 세션을 정리하고
      // 다시 로그인하게 합니다.
      let bouncedBack = false;
      try { bouncedBack = sessionStorage.getItem('auth_redirect') === '1'; } catch (e) {}

      try {
        const session = await getSession();
        if (!session) return;

        if (bouncedBack) {
          try { sessionStorage.removeItem('auth_redirect'); } catch (e) {}
          try { await getSB().auth.signOut(); } catch (e) {}
          showNotice('로그인 상태를 확인할 수 없어 정리했습니다. 다시 로그인해 주세요.');
          return;
        }
        window.location.replace('index.html');
      } catch (e) { /* 세션 확인 실패 시 그냥 로그인 화면을 보여줍니다 */ }
    })();

    document.getElementById('login-form').addEventListener('submit', async function (event) {
      event.preventDefault();
      clearError();

      const id = document.getElementById('loginId').value;
      const pw = document.getElementById('loginPassword').value;

      loginBtn.disabled = true;
      const originalLabel = loginBtn.textContent;
      loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>확인 중...';

      const result = await performLogin(id, pw);

      if (result.success) {
        window.location.replace('index.html');
        return;
      }

      // 실패하면 비밀번호 칸만 비웁니다 (아이디는 다시 치지 않게).
      document.getElementById('loginPassword').value = '';
      loginBtn.disabled = false;
      loginBtn.textContent = originalLabel;
      showError(result.error);
      document.getElementById('loginPassword').focus();
    });
  </script>
</body>
</html>
